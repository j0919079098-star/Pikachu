<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的小草地</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#A9D8EA;
  --sky-top:#A9D8EA; --sky-bot:#E9F4DE; --orb:#FFF3C4;
  --hill-far:#A9CFA1; --hill-near:#87BA7D;
  --grass-a:#72AD5C; --grass-b:#67A255; --tuft:#3F7B40; --stone:#B7BFB2;
  --ui-bg:rgba(255,255,255,.93); --ui-line:rgba(31,46,36,.16);
  --ink:#1F2E24; --ink-soft:#52645A;
  --accent:#2E7D46; --accent-ink:#FFFFFF; --heart:#E85D75; --check:rgba(31,46,36,.10);
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15233A;
    --sky-top:#15233A; --sky-bot:#34504F; --orb:#E4EAFB;
    --hill-far:#2B4B40; --hill-near:#234230;
    --grass-a:#2D5B37; --grass-b:#28502F; --tuft:#1B3B25; --stone:#4C5A52;
    --ui-bg:rgba(24,32,28,.93); --ui-line:rgba(230,240,228,.18);
    --ink:#E6F0E4; --ink-soft:#9BB0A0;
    --accent:#6BC585; --accent-ink:#10221A; --heart:#FF8FA3; --check:rgba(230,240,228,.12);
  }
}
:root[data-theme="dark"]{
  --bg:#15233A;
  --sky-top:#15233A; --sky-bot:#34504F; --orb:#E4EAFB;
  --hill-far:#2B4B40; --hill-near:#234230;
  --grass-a:#2D5B37; --grass-b:#28502F; --tuft:#1B3B25; --stone:#4C5A52;
  --ui-bg:rgba(24,32,28,.93); --ui-line:rgba(230,240,228,.18);
  --ink:#E6F0E4; --ink-soft:#9BB0A0;
  --accent:#6BC585; --accent-ink:#10221A; --heart:#FF8FA3; --check:rgba(230,240,228,.12);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;min-height:44px;padding:0 20px;font-weight:700;font-size:16px}
.primary:hover{filter:brightness(1.06)}
.ghost{background:transparent;border:1px solid var(--ui-line);border-radius:10px;min-height:44px;padding:0 14px;font-size:15px}
.ghost:hover{background:var(--ui-line)}

.empty{position:fixed;left:50%;top:60%;transform:translate(-50%,-50%);width:min(350px,calc(100vw - 32px));
  padding:26px 24px;border-radius:20px;background:var(--ui-bg);border:1px solid var(--ui-line);text-align:center;backdrop-filter:blur(8px)}
.empty h1{margin:0 0 8px;font-size:24px;line-height:1.3;font-weight:700}
.empty p{margin:0 0 18px;color:var(--ink-soft);font-size:15px;line-height:1.7}
.empty .stack{display:flex;flex-direction:column;gap:8px}

.panel{position:fixed;left:16px;bottom:16px;width:min(320px,calc(100vw - 32px));max-height:60vh;overflow:auto;
  padding:14px;border-radius:18px;background:var(--ui-bg);border:1px solid var(--ui-line);backdrop-filter:blur(8px)}
.top{display:flex;gap:8px;align-items:center}
.chips{display:flex;gap:8px;flex:1;overflow-x:auto;padding:3px}
.chip{flex:none;width:44px;height:44px;border-radius:50%;padding:3px;border:2px solid transparent;background:var(--ui-line)}
.chip img{width:100%;height:100%;object-fit:contain;display:block}
.chip.on{border-color:var(--accent)}
.add{flex:none;width:44px;height:44px;padding:0;font-size:24px;line-height:1}
.who{margin:10px 0 0;font-size:13px;color:var(--ink-soft);line-height:1.5}
.ctl{margin-top:14px}
.ctl label{display:flex;justify-content:space-between;font-size:14px;font-weight:500;margin-bottom:4px}
.ctl output{color:var(--ink-soft)}
.ctl small{display:block;color:var(--ink-soft);font-size:13px;margin-top:2px}
input[type=range]{width:100%;height:32px;accent-color:var(--accent);margin:0}
.btns{display:flex;gap:8px;margin-top:12px}
.btns .ghost{flex:1}
.hint{margin:12px 0 0;font-size:13px;line-height:1.6;color:var(--ink-soft)}
.note{margin:8px 0 0;font-size:13px;color:var(--heart)}

.prep{position:fixed;inset:0;z-index:10;background:rgba(10,18,14,.7);display:flex;align-items:center;justify-content:center;padding:14px}
.prepBox{width:min(380px,100%);max-height:100%;overflow:auto;background:var(--ui-bg);border:1px solid var(--ui-line);border-radius:20px;padding:18px}
.prepBox h2{margin:0 0 4px;font-size:19px;font-weight:700}
.prepBox p{margin:0 0 12px;font-size:14px;line-height:1.6;color:var(--ink-soft)}
.view{border-radius:14px;overflow:hidden;line-height:0;background:conic-gradient(var(--check) 25%,transparent 0 50%,var(--check) 0 75%,transparent 0) 0 0/20px 20px}
#prepCv{width:100%;height:auto;aspect-ratio:1/1;touch-action:none}
#prepCv.draw{cursor:crosshair}
.prepBox .btns .primary{flex:1.4}

@media (max-width:560px){
  .panel{left:8px;right:8px;bottom:8px;width:auto;max-height:46vh}
}
</style>
</head>
<body>
<canvas id="stage" role="img" aria-label="草地飼養環境,大家放進來的角色會在裡面自由走動"></canvas>

<section class="empty" id="empty" hidden>
  <h1>把照片放進草地</h1>
  <p>選一張皮卡丘的照片,牠就會在草地上走、跑、爬。背景很雜的照片,可以手動描邊去背。</p>
  <div class="stack">
    <button class="primary" id="add0">選擇照片</button>
    <button class="ghost" id="demo">先放一隻示範皮卡丘</button>
  </div>
</section>

<aside class="panel" id="panel" hidden>
  <div class="top">
    <div class="chips" id="chips"></div>
    <button class="ghost add" id="add1" aria-label="再加一張照片">+</button>
  </div>
  <p class="who" id="who"></p>
  <div id="selBox" hidden>
    <div class="ctl">
      <label for="size">大小 <output id="sizeOut"></output></label>
      <input type="range" id="size" min="50" max="200" step="5">
    </div>
    <div class="btns">
      <button class="ghost" id="flip">翻轉方向</button>
      <button class="ghost" id="del">移除牠</button>
    </div>
  </div>
  <p class="hint">點牠一下會撒嬌,自己的角色可以按住抱起來,點草地牠會跑過來。</p>
  <p class="note" id="note" role="status" aria-live="polite"></p>
</aside>

<div class="prep" id="prep" hidden>
  <div class="prepBox">
    <h2>放進草地前先去背</h2>
    <p id="prepMsg">背景單純的照片可以自動去背。背景很雜的話,用手動描邊。</p>
    <div class="view"><canvas id="prepCv" width="320" height="320"></canvas></div>
    <div class="ctl" id="tolRow">
      <label for="tol">自動去背強度 <output id="tolOut"></output></label>
      <input type="range" id="tol" min="0" max="120" step="1">
    </div>
    <div class="btns" id="gPreview">
      <button class="ghost" id="pCancel">取消</button>
      <button class="ghost" id="pLasso">手動描邊</button>
      <button class="primary" id="pAdd">放進草地</button>
    </div>
    <div class="btns" id="gLasso" hidden>
      <button class="ghost" id="lBack">返回</button>
      <button class="ghost" id="lRedo">重畫</button>
      <button class="primary" id="lDone">完成</button>
    </div>
  </div>
</div>

<input type="file" id="file" accept="image/*" hidden>

  function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

  function hill(b, col, base, f1, p1, a2, f2){
    const k = Math.max(.6, H/800);
    b.fillStyle = col; b.beginPath(); b.moveTo(0, horizon + 2);
    for (let x = 0; x <= W + 8; x += 8){
      const y = horizon - base*k*0.6 - base*k*0.5*Math.sin(x*f1 + p1) - a2*k*0.3*Math.sin(x*f2 + p1*2);
      b.lineTo(x, y);
    }
    b.lineTo(W, horizon + 2); b.closePath(); b.fill();
  }

  function drawBg(){
    bgCanvas = document.createElement('canvas');
    bgCanvas.width = W*dpr; bgCanvas.height = H*dpr;
    const b = bgCanvas.getContext('2d'); b.scale(dpr, dpr);
    horizon = H*0.36;

    const g = b.createLinearGradient(0, 0, 0, horizon);
    g.addColorStop(0, css('--sky-top')); g.addColorStop(1, css('--sky-bot'));
    b.fillStyle = g; b.fillRect(0, 0, W, horizon + 2);
    b.fillStyle = css('--orb'); b.beginPath();
    b.arc(W*0.8, horizon*0.42, Math.min(38, horizon*0.14), 0, 7); b.fill();

    hill(b, css('--hill-far'), 34, 0.0042, 1.3, 22, 0.011);
    hill(b, css('--hill-near'), 14, 0.006, 4.1, 9, 0.017);

    let y = horizon, h = 3, i = 0;
    const ca = css('--grass-a'), cb = css('--grass-b');
    while (y < H){ b.fillStyle = i % 2 ? ca : cb; b.fillRect(0, y, W, h + 1); y += h; h *= 1.16; i++; }

    const rnd = mulberry(7), span = H - horizon;
    const depthOf = d => 0.5 + 0.8*d;

    b.fillStyle = css('--stone');
    for (let n = 0; n < 6; n++){
      const d = Math.pow(rnd(), .8), yy = horizon + span*(.1 + d*.85), xx = rnd()*W, s = depthOf(d);
      b.beginPath(); b.ellipse(xx, yy, 14*s, 7*s, 0, 0, 7); b.fill();
    }
    b.strokeStyle = css('--tuft'); b.lineCap = 'round';
    for (let n = 0; n < 110; n++){
      const d = Math.pow(rnd(), .8), yy = horizon + span*(.05 + d*.93), xx = rnd()*W, s = depthOf(d);
      b.lineWidth = Math.max(1, 1.6*s);
      for (let k = -1; k <= 1; k++){
        b.beginPath(); b.moveTo(xx + k*3*s, yy);
        b.quadraticCurveTo(xx + k*4*s, yy - 7*s, xx + k*7*s, yy - 12*s); b.stroke();
      }
    }
    const pal = ['#FFFFFF', '#FFE27A', '#F7A8C0', '#B9A6F2'];
    for (let n = 0; n < 34; n++){
      const d = Math.pow(rnd(), .8), yy = horizon + span*(.06 + d*.92), xx = rnd()*W, s = depthOf(d);
      b.fillStyle = pal[(rnd()*pal.length)|0];
      for (let k = 0; k < 5; k++){
        const a = k*1.2566;
        b.beginPath(); b.arc(xx + Math.cos(a)*2.4*s, yy + Math.sin(a)*2.4*s, 1.9*s, 0, 7); b.fill();
      }
      b.fillStyle = '#E8A93A'; b.beginPath(); b.arc(xx, yy, 1.4*s, 0, 7); b.fill();
    }
  }

  function makeSprite(orig, tol){
    const w = orig.width, h = orig.height;
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d', {willReadFrequently:true}); x.drawImage(orig, 0, 0);
    if (tol <= 0) return c;

    const id = x.getImageData(0, 0, w, h), d = id.data;
    let r = 0, g = 0, b = 0, n = 0;
    const bs = Math.max(2, Math.round(Math.min(w, h)*0.03));
    for (const [cx, cy] of [[0,0],[w-bs,0],[0,h-bs],[w-bs,h-bs]])
      for (let j = 0; j < bs; j++) for (let i = 0; i < bs; i++){
        const k = ((cy + j)*w + cx + i)*4;
        if (d[k+3] > 128){ r += d[k]; g += d[k+1]; b += d[k+2]; n++; }
      }
    if (n){ r /= n; g /= n; b /= n; }
    const dist = k => d[k+3] < 128 ? 0 : Math.hypot(d[k]-r, d[k+1]-g, d[k+2]-b);

    const seen = new Uint8Array(w*h), stack = [];
    const push = i => { if (!seen[i] && dist(i*4) < tol){ seen[i] = 1; stack.push(i); } };
    for (let i = 0; i < w; i++){ push(i); push((h-1)*w + i); }
    for (let j = 0; j < h; j++){ push(j*w); push(j*w + w - 1); }
    while (stack.length){
      const i = stack.pop(), px = i % w, py = (i / w) | 0;
      if (px > 0) push(i-1); if (px < w-1) push(i+1);
      if (py > 0) push(i-w); if (py < h-1) push(i+w);
    }
    let removed = 0;
    for (let i = 0; i < w*h; i++) if (seen[i]) removed++;
    if (removed > w*h*0.93) return c;

    for (let py = 0; py < h; py++) for (let px = 0; px < w; px++){
      const i = py*w + px;
      if (seen[i]){ d[i*4+3] = 0; continue; }
      const nb = (px>0 && seen[i-1]) || (px<w-1 && seen[i+1]) || (py>0 && seen[i-w]) || (py<h-1 && seen[i+w]);
      if (nb) d[i*4+3] = d[i*4+3]*0.55;
    }
    x.putImageData(id, 0, 0);
    return cropAlpha(c) || c;
  }

  function cropAlpha(c){
    const w = c.width, h = c.height;
    const d = c.getContext('2d', {willReadFrequently:true}).getImageData(0, 0, w, h).data;
    let x0 = w, y0 = h, x1 = 0, y1 = 0;
    for (let py = 0; py < h; py++) for (let px = 0; px < w; px++){
      if (d[(py*w + px)*4 + 3] > 20){ if (px<x0)x0=px; if (px>x1)x1=px; if (py<y0)y0=py; if (py>y1)y1=py; }
    }
    if (x1 <= x0 || y1 <= y0) return null;
    const pad = 2; x0 = Math.max(0, x0-pad); y0 = Math.max(0, y0-pad); x1 = Math.min(w-1, x1+pad); y1 = Math.min(h-1, y1+pad);
    const o = document.createElement('canvas'); o.width = x1-x0+1; o.height = y1-y0+1;
    o.getContext('2d').drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
    return o;
  }

  function encode(canvas){
    for (const m of [220, 170, 130]){
      const s = Math.min(1, m/Math.max(canvas.width, canvas.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(canvas.width*s)); c.height = Math.max(1, Math.round(canvas.height*s));
      c.getContext('2d').drawImage(canvas, 0, 0, c.width, c.height);
      let u = c.toDataURL('image/webp', .85);
      if (!u.startsWith('data:image/webp')) u = c.toDataURL('image/png');
      if (u.length < 170000) return u;
    }
    return null;
  }

  function newPet(d){

    const ids = new Set(docs.map(d => d.id));
    for (const d of docs){
      const p = pets.find(q => q.id === d.id);
      if (!p) pets.push(newPet(d));
      else { p.size = d.size ?? 1; p.flip = !!d.flip; p.owner = d.owner; }
    }
    for (let i = pets.length - 1; i >= 0; i--) if (!ids.has(pets[i].id)) pets.splice(i, 1);
    if (sel && !pets.includes(sel)) sel = null;
    if (!sel && pets.length) sel = pets.find(p => p.owner === myId) || pets[pets.length - 1];
    refreshUI();
  }

  const saveLocal = () => { try { localStorage.setItem('meadow2', JSON.stringify(localDocs)); } catch(e){} };

  async function addToMeadow(url){
    if (pets.length >= MAX_PETS){ note('草地最多住 ' + MAX_PETS + ' 隻,先移除一隻再加。'); return false; }
    const id = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const doc = {img: url, size: 1, flip: false, owner: myId, at: Date.now()};
    if (cloud){
      try { await cloud.doc(id).set(doc); }
      catch(e){ note(e && e.code === 'quota_exceeded' ? '共用草地已滿,先移除一些角色。' : '這次沒有放進去,再試一次。'); return false; }
    } else {
      localDocs.push({id, ...doc}); saveLocal(); applyDocs(localDocs);
    }
    return true;
  }

  async function patchDoc(id, patch){
    if (cloud){ try { await cloud.doc(id).update(patch); } catch(e){} }
    else { const d = localDocs.find(x => x.id === id); if (d){ Object.assign(d, patch); saveLocal(); } }
  }

  async function removePet(p){
    if (cloud){ try { await cloud.doc(p.id).delete(); } catch(e){ note('移除失敗,再試一次。'); } }
    else { const i = localDocs.findIndex(x => x.id === p.id); if (i >= 0) localDocs.splice(i, 1); saveLocal(); applyDocs(localDocs); }
  }

  function select(p){ sel = p; refreshUI(); }

  function updateWho(){
    if (!ready) { whoEl.textContent = ''; return; }
    if (!cloud) whoEl.textContent = '角色會存在這個瀏覽器裡,下次打開還在。';
    else if (!room) whoEl.textContent = '共用草地已連上,但即時同步不可用。';
    else whoEl.textContent = peerCount > 1 ? '現在有 ' + peerCount + ' 個人在草地上。' : '現在只有你在草地上,把連結傳給她吧。';
  }

  function refreshUI(){
    empty.hidden = !ready || pets.length > 0;
    panel.hidden = !ready || pets.length === 0;
    chips.innerHTML = '';
    pets.forEach((p, i) => {
      const b = document.createElement('button');
      b.className = 'chip' + (p === sel ? ' on' : '');
      b.setAttribute('aria-label', '選取第 ' + (i + 1) + ' 隻');
      const im = new Image(); im.src = p.thumb; im.alt = '';
      b.append(im); b.onclick = () => select(p);
      chips.append(b);
    });
    selBox.hidden = !sel;
    if (sel){ sizeIn.value = Math.round(sel.size*100); sizeOut.textContent = Math.round(sel.size*100) + '%'; }
    updateWho();
  }

  /* ---------- prep dialog: cut-out before joining the meadow ---------- */
  const prepEl = $('prep'), pcv = $('prepCv'), pctx = pcv.getContext('2d');
  const tolIn = $('tol'), tolOut = $('tolOut'), prepMsg = $('prepMsg');
  const PS = 320, MSG = '背景單純的照片可以自動去背。背景很雜的話,用手動描邊。';
  let prep = null, pmode = 'preview', ppts = [], pdraw = false, fit = {s: 1, ox: 0, oy: 0};

  const fitFor = (w, h) => { const s = Math.min(PS/w, PS/h); return {s, ox: (PS - w*s)/2, oy: (PS - h*s)/2}; };

  function prepRender(){
    pctx.clearRect(0, 0, PS, PS);
    const c = pmode === 'preview' ? (prep.lassoCut || prep.sprite) : prep.raw;
    fit = fitFor(c.width, c.height);
    pctx.drawImage(c, fit.ox, fit.oy, c.width*fit.s, c.height*fit.s);
    if (pmode === 'lasso' && ppts.length > 1){
      pctx.beginPath(); pctx.moveTo(ppts[0].x, ppts[0].y);
      for (const q of ppts) pctx.lineTo(q.x, q.y);
      if (!pdraw) pctx.closePath();
      pctx.lineWidth = 3; pctx.strokeStyle = '#FF3B6B'; pctx.setLineDash([8, 5]); pctx.stroke(); pctx.setLineDash([]);
    }
  }

  function setMode(m){
    pmode = m; ppts = [];
    $('gPreview').hidden = m !== 'preview'; $('gLasso').hidden = m !== 'lasso';
    $('tolRow').hidden = m !== 'preview';
    pcv.classList.toggle('draw', m === 'lasso');
    prepMsg.textContent = m === 'lasso' ? '沿著角色的輪廓畫一整圈,圈外的背景會被去掉。' : MSG;
    prepRender();
  }

  function openPrep(img){
    const s = Math.min(1, 360/Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.naturalWidth*s)); c.height = Math.max(1, Math.round(img.naturalHeight*s));
    const x = c.getContext('2d', {willReadFrequently:true}); x.drawImage(img, 0, 0, c.width, c.height);
    let hasAlpha = false;
    try { const d = x.getImageData(0, 0, c.width, c.height).data; for (let i = 3; i < d.length; i += 28) if (d[i] < 200){ hasAlpha = true; break; } } catch(e){}
    const tol = hasAlpha ? 0 : 40;
    prep = {raw: c, tol, sprite: makeSprite(c, tol), lassoCut: null};
    tolIn.value = tol; tolOut.textContent = tol ? tol : '關閉';
    prepEl.hidden = false; setMode('preview');
  }

  tolIn.oninput = () => {
    if (!prep) return;
    prep.tol = +tolIn.value; tolOut.textContent = prep.tol ? prep.tol : '關閉';
    prep.lassoCut = null; prep.sprite = makeSprite(prep.raw, prep.tol); prepRender();
  };
  $('pCancel').onclick = () => { prepEl.hidden = true; prep = null; };
  $('pLasso').onclick = () => setMode('lasso');
  $('lBack').onclick = () => setMode('preview');
  $('lRedo').onclick = () => { ppts = []; prepRender(); };
  $('pAdd').onclick = async () => {
    if (!prep) return;
    const url = encode(prep.lassoCut || prep.sprite);
    if (!url){ prepMsg.textContent = '這張圖太大了,換一張或用手動描邊縮小範圍。'; return; }
    $('pAdd').disabled = true;
    const ok = await addToMeadow(url);
    $('pAdd').disabled = false;
    if (ok){ prepEl.hidden = true; prep = null; }
  };
  $('lDone').onclick = () => {
    if (ppts.length < 8){ prepMsg.textContent = '還沒有畫出封閉的圈,請沿著角色畫一整圈。'; return; }
    const raw = prep.raw, c = document.createElement('canvas'); c.width = raw.width; c.height = raw.height;
    const x = c.getContext('2d', {willReadFrequently:true});
    x.beginPath(); ppts.forEach((q, i) => { const px = (q.x - fit.ox)/fit.s, py = (q.y - fit.oy)/fit.s; i ? x.lineTo(px, py) : x.moveTo(px, py); });
    x.closePath(); x.clip(); x.drawImage(raw, 0, 0);
    const o = cropAlpha(c);
    if (!o){ prepMsg.textContent = '圈的範圍太小,請重畫。'; return; }
    prep.lassoCut = o; tolIn.value = 0; tolOut.textContent = '關閉'; setMode('preview');
  };
  const ppos = e => { const r = pcv.getBoundingClientRect(); return {x: (e.clientX - r.left)*PS/r.width, y: (e.clientY - r.top)*PS/r.height}; };
  pcv.addEventListener('pointerdown', e => { if (pmode !== 'lasso') return; pdraw = true; ppts = [ppos(e)]; pcv.setPointerCapture(e.pointerId); prepRender(); });
  pcv.addEventListener('pointermove', e => { if (!pdraw) return; ppts.push(ppos(e)); prepRender(); });
  const pend = () => { if (pdraw){ pdraw = false; prepRender(); } };
  pcv.addEventListener('pointerup', pend); pcv.addEventListener('pointercancel', pend);

  /* ---------- upload ---------- */
  const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });

  async function handleFile(f){
    if (!f) return;
    if (!f.type.startsWith('image/')){ note('請選擇圖片檔案。'); return; }
    if (pets.length >= MAX_PETS){ note('草地最多住 ' + MAX_PETS + ' 隻,先移除一隻再加。'); return; }
    try {
      const url = URL.createObjectURL(f);
      const img = await loadImg(url);
      URL.revokeObjectURL(url);
      openPrep(img);
    } catch(e){ note('這張照片讀不進來,換一張試試。'); }
  }
  $('add0').onclick = $('add1').onclick = () => fileIn.click();
  fileIn.onchange = () => { handleFile(fileIn.files[0]); fileIn.value = ''; };
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('drop', e => { e.preventDefault(); const f = e.dataTransfer?.files?.[0]; if (f) handleFile(f); });
  addEventListener('paste', e => { const f = e.clipboardData?.files?.[0]; if (f) handleFile(f); });

  $('demo').onclick = async () => {
    try {
      const img = await loadImg(DEFAULT_PET);
      const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
      c.getContext('2d').drawImage(img, 0, 0);
      const url = encode(c); if (url) addToMeadow(url);
    } catch(e){ note('示範角色載入失敗。'); }
  };

  /* ---------- controls ---------- */
  let sizeT;
  sizeIn.oninput = () => {
    if (!sel) return;
    sel.size = +sizeIn.value/100; sizeOut.textContent = sizeIn.value + '%';
    const id = sel.id, v = sel.size;
    clearTimeout(sizeT); sizeT = setTimeout(() => patchDoc(id, {size: v}), 300);
  };
  $('flip').onclick = () => { if (sel){ sel.flip = !sel.flip; patchDoc(sel.id, {flip: sel.flip}); } };
  $('del').onclick = () => { if (sel) removePet(sel); };

  /* ---------- behaviour ---------- */
  const controlled = p => p.owner === myId || !online.has(p.owner);

  function next(p, k){
    const r = Math.random();
    if (r < .62){
      const t = Math.random();
      p.state = t < .5 ? 'walk' : t < .8 ? 'run' : 'crawl';
      const ang = rand(0, 6.283), dd = rand(90, 380)*k, [x0, x1] = gx(), [y0, y1] = gy();
      p.tx = clamp(p.x + Math.cos(ang)*dd, x0, x1);
      p.ty = clamp(p.y + Math.sin(ang)*dd*.5, y0, y1);
    } else if (r < .8){
      p.state = 'hop'; p.hops = (Math.random()*3) | 0; p.jv = 520*k*M;
    } else {
      p.timer = rand(1, 3.2);
      if (Math.random() < .35) p.face *= -1;
    }
  }

  const SPEED = {walk: 78, run: 250, crawl: 42};
  const FREQ = {walk: 9, run: 15, crawl: 6, idle: 2.4, hop: 2.4, held: 2.4};

  function update(dt){
    const k = Math.max(.6, Math.min(W, H)/700);
    for (const p of pets){
      if (!p.ready) continue;
      const s = depth(p.y), c = controlled(p);
      if (c !== p.wasC){ if (c){ p.state = 'idle'; p.timer = rand(.3, 1); p.tx = p.x; p.ty = p.y; } p.wasC = c; }

      if (!c){
        const a = remote.get(p.id);
        if (a){
          const tx = a[0]*W, ty = horizon + a[1]*(H - horizon), f = p.seenRemote ? 1 - Math.exp(-14*dt) : 1;
          p.seenRemote = true;
          p.x += (tx - p.x)*f; p.y += (ty - p.y)*f;
          p.face = a[2] < 0 ? -1 : 1; p.state = STATES[a[3]] || 'idle';
          p.jh += (a[4]*baseU() - p.jh)*Math.min(1, dt*18);
        }
        p.t += dt*(FREQ[p.state] || 2.4);
        p.squash *= Math.exp(-9*dt);
        continue;
      }
      p.seenRemote = false;

      if (p.state === 'held'){ p.jh += (26 - p.jh)*Math.min(1, dt*14); p.jv = 0; }
      else if (p.jh > 0 || p.jv !== 0){
        p.jv -= 1900*dt; p.jh += p.jv*dt;
        if (p.jh <= 0){ if (p.jv < -260) p.squash = clamp(-p.jv/2600, .08, .26); p.jh = 0; p.jv = 0; }
      }
      p.squash *= Math.exp(-9*dt);

      switch (p.state){
        case 'idle':
          p.t += dt*2.4; p.timer -= dt;
          if (p.timer <= 0 && p.jh === 0) next(p, k);
          break;
        case 'hop':
          p.t += dt*2.4;
          if (p.jh === 0 && p.jv === 0){
            if (p.hops > 0){ p.hops--; p.jv = 520*k*M; }
            else { p.state = 'idle'; p.timer = rand(.6, 1.6); }
          }
          break;
        case 'walk': case 'run': case 'crawl': {
          p.t += dt*FREQ[p.state];
          const dx = p.tx - p.x, dy = p.ty - p.y, dist = Math.hypot(dx, dy);
          const step = SPEED[p.state]*k*s*(reduce ? .6 : 1)*dt;
          if (dist <= step){ p.x = p.tx; p.y = p.ty; p.state = 'idle'; p.timer = rand(.6, 2.2); }
          else { p.x += dx/dist*step; p.y += dy/dist*step; if (Math.abs(dx) > 4) p.face = Math.sign(dx); }
          break;
        }
        case 'held': p.t += dt*2.4; break;
      }
    }
    for (let i = hearts.length - 1; i >= 0; i--){
      const h = hearts[i]; h.life -= dt; h.x += h.vx*dt; h.y += h.vy*dt;
      if (h.life <= 0) hearts.splice(i, 1);
    }
  }

  function dims(p){
    const U = baseU()*p.size*depth(p.y), ar = p.sw/p.sh;
    return ar >= 1 ? {w: U, h: U/ar, s: depth(p.y)} : {w: U*ar, h: U, s: depth(p.y)};
  }

  /* ---------- render ---------- */
  function render(){
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(bgCanvas, 0, 0, W, H);

    const order = pets.filter(p => p.ready).sort((a, b) => a.y - b.y);
    for (const p of order){
      const {w, h, s} = dims(p);
      let bob = 0, tilt = 0, sx = 1, sy = 1;
      const ph = Math.sin(p.t);
      if (p.state === 'walk'){ bob = Math.abs(ph)*9*s*M; tilt = ph*.06; sy = 1 - Math.abs(ph)*.03; }
      else if (p.state === 'run'){ bob = Math.abs(ph)*20*s*M; tilt = .12 + ph*.05; sx = 1.04; sy = .98; }
      else if (p.state === 'crawl'){ tilt = ph*.1; sx = 1.14; sy = .78; }
      else { sy = 1 + .02*ph; sx = 1 - .01*ph; }
      sx *= 1 + p.squash*.8; sy *= 1 - p.squash;

      const lift = bob + p.jh;
      const sw = w*.55*(1 - Math.min(lift, 70)/140);
      ctx.fillStyle = 'rgba(0,0,0,.22)';
      ctx.beginPath(); ctx.ellipse(p.x, p.y, sw, sw*.24, 0, 0, 7); ctx.fill();

      if (p === sel && pets.length > 1){
        ctx.strokeStyle = css('--accent'); ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
        ctx.beginPath(); ctx.ellipse(p.x, p.y, w*.62, w*.62*.26, 0, 0, 7); ctx.stroke(); ctx.setLineDash([]);
      }

      ctx.save();
      ctx.translate(p.x, p.y - lift);
      ctx.rotate(tilt*p.face);
      ctx.scale(p.face*(p.flip ? -1 : 1)*sx, sy);
      ctx.drawImage(p.sprite, -w/2, -h, w, h);
      ctx.restore();
    }

    ctx.textAlign = 'center'; ctx.fillStyle = css('--heart');
    for (const h of hearts){
      ctx.globalAlpha = clamp(h.life/.6, 0, 1);
      ctx.font = h.size + 'px sans-serif';
      ctx.fillText('♥', h.x, h.y);
    }
    ctx.globalAlpha = 1;
  }

  let last = performance.now();
  function frame(now){
    const dt = Math.min(.05, (now - last)/1000); last = now;
    update(dt); render(); requestAnimationFrame(frame);
  }

  /* ---------- pointer ---------- */
  function hit(x, y){
    for (const p of pets.filter(q => q.ready).sort((a, b) => b.y - a.y)){
      const {w, h} = dims(p);
      if (x > p.x - w/2 && x < p.x + w/2 && y > p.y - p.jh - h && y < p.y - p.jh) return p;
    }
    return null;
  }

  function heartsAt(p){
    const {h} = dims(p);
    for (let i = 0; i < 4; i++)
      hearts.push({x: p.x + rand(-18, 18), y: p.y - p.jh - h*.9, vx: rand(-20, 20), vy: rand(-70, -40), life: 1.1, size: rand(16, 26)});
  }
  function petIt(p){
    const k = Math.max(.6, Math.min(W, H)/700);
    p.state = 'idle'; p.timer = 1.2; p.jv = 480*k*M;
    heartsAt(p);
  }
  function poke(p){
    if (controlled(p)) petIt(p); else heartsAt(p);
    if (room) room.emit('poke', {id: p.id}).catch(() => {});
  }

  cv.addEventListener('pointerdown', e => {
    const x = e.clientX, y = e.clientY, p = hit(x, y);
    if (p){
      select(p);
      if (controlled(p)){
        drag = {p, sx: x, sy: y, ox: x - p.x, oy: y - p.y, moved: false};
        p.state = 'held';
        cv.setPointerCapture(e.pointerId);
      } else poke(p);
    } else {
      let q = null, best = 1e12;
      for (const c of pets){ if (!c.ready || !controlled(c) || c.state === 'held') continue; const d = Math.hypot(c.x - x, c.y - y); if (d < best){ best = d; q = c; } }
      if (q){
        const [x0, x1] = gx(), [y0, y1] = gy();
        q.tx = clamp(x, x0, x1); q.ty = clamp(y, y0, y1);
        q.state = 'run'; q.face = q.tx >= q.x ? 1 : -1;
      }
    }
  });
  cv.addEventListener('pointermove', e => {
    const x = e.clientX, y = e.clientY;
    if (drag){
      if (!drag.moved && Math.hypot(x - drag.sx, y - drag.sy) > 6) drag.moved = true;
      if (drag.moved){
        const [x0, x1] = gx(), [y0, y1] = gy();
        drag.p.x = clamp(x - drag.ox, x0, x1); drag.p.y = clamp(y - drag.oy, y0, y1);
      }
    } else cv.style.cursor = hit(x, y) ? 'grab' : 'default';
  });
  const release = () => {
    if (!drag) return;
    const {p, moved} = drag; drag = null;
    p.state = 'idle'; p.timer = rand(.6, 1.2);
    if (!moved) poke(p);
  };
  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', release);

  /* ---------- theme, loop, boot ---------- */
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => drawBg());
  new MutationObserver(() => drawBg()).observe(root, {attributes: true, attributeFilter: ['data-theme']});
  addEventListener('resize', resize);

  resize();
  requestAnimationFrame(frame);

  let lastP = '';
  setInterval(() => {
    if (!room) return;
    const o = {};
    for (const p of pets){
      if (p.ready && p.owner === myId) o[p.id] = [r3(p.x/W), r3((p.y - horizon)/(H - horizon)), p.face, CODE[p.state] ?? 0, r3(p.jh/baseU())];
    }
    const s = JSON.stringify(o);
    if (s === lastP) return;
    lastP = s;
    room.presence({u: myId, p: o}).catch(() => {});
  }, 100);

  (async () => {
    let db = null, rm = null, us = null;
    if (window.claude && window.claude.use){
      try { [db, rm, us] = await Promise.all([claude.use('db'), claude.use('room'), claude.use('user')]); } catch(e){}
    }
    if (us){ try { const id = await us.id(); if (id) myId = String(id); } catch(e){} }
    room = rm;

    if (rm){
      rm.on('poke', m => {
        if (m.isMe) return;
        const p = pets.find(q => q.id === (m.data && m.data.id));
        if (!p) return;
        if (controlled(p)) petIt(p); else heartsAt(p);
      });
      rm.onPeers(ch => {
        remote.clear(); online = new Set(); let n = 0;
        for (const pr of ch.peers){
          if (pr.kind !== 'viewer') continue;
          n++;
          if (pr.isMe) continue;
          const u = pr.presence && pr.presence.u;
          if (typeof u === 'string') online.add(u);
          const pp = pr.presence && pr.presence.p;
          if (pp && typeof pp === 'object') for (const id in pp){ const a = pp[id]; if (Array.isArray(a) && a.length >= 5) remote.set(id, a); }
        }
        peerCount = n; updateWho();
      });
    }

    if (db){
      cloud = db.collection('pets');
      cloud.onSnapshot(snap => {
        ready = true;
        applyDocs(snap.docs.map(d => ({id: d.id, ...d.data()})));
      }, () => { note('共用草地連線中斷,重新整理看看。'); });
    } else {
      try {
        const saved = JSON.parse(localStorage.getItem('meadow2') || '[]');
        if (Array.isArray(saved)) for (const d of saved) if (d && d.id && d.img) localDocs.push(d);
      } catch(e){}
      ready = true;
      applyDocs(localDocs);
    }
  })();
})();
</script>
</body>
</html>

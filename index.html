<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的小草地</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#A9D8EA;
  --ui-bg:rgba(255,255,255,.94); --ui-line:rgba(31,46,36,.16);
  --ink:#1F2E24; --ink-soft:#52645A;
  --accent:#2E7D46; --accent-ink:#FFFFFF; --heart:#E85D75; --check:rgba(31,46,36,.10);
  --dock-h:64px;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15233A;
    --ui-bg:rgba(24,32,28,.94); --ui-line:rgba(230,240,228,.18);
    --ink:#E6F0E4; --ink-soft:#9BB0A0;
    --accent:#6BC585; --accent-ink:#10221A; --heart:#FF8FA3; --check:rgba(230,240,228,.12);
  }
}
:root[data-theme="dark"]{
  --bg:#15233A;
  --ui-bg:rgba(24,32,28,.94); --ui-line:rgba(230,240,228,.18);
  --ink:#E6F0E4; --ink-soft:#9BB0A0;
  --accent:#6BC585; --accent-ink:#10221A; --heart:#FF8FA3; --check:rgba(230,240,228,.12);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;min-height:44px;padding:0 20px;font-weight:700;font-size:16px}
.primary:hover{filter:brightness(1.06)}
.ghost{background:transparent;border:1px solid var(--ui-line);border-radius:10px;min-height:44px;padding:0 14px;font-size:15px}
.ghost:hover{background:var(--ui-line)}

/* bottom dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;gap:10px;
  padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--ui-bg);border-top:1px solid var(--ui-line);backdrop-filter:blur(8px)}
.dock button{flex:1;max-width:170px;min-height:48px;border-radius:14px;border:1px solid transparent;background:transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:13px;font-weight:500;color:var(--ink)}
.dock button svg{width:24px;height:24px;display:block}
.dock button:hover{background:var(--ui-line)}
.dock button.on{background:var(--ui-line);border-color:var(--ui-line)}
.dock .danger{color:var(--heart)}

/* tray above the dock */
.tray{position:fixed;left:0;right:0;bottom:var(--dock-h);z-index:4;padding:10px 12px 12px;background:var(--ui-bg);
  border-top:1px solid var(--ui-line);backdrop-filter:blur(8px)}
.tray h2{margin:0 0 8px;font-size:13px;font-weight:500;color:var(--ink-soft)}
.row{display:flex;gap:10px;overflow-x:auto;padding:8px 8px 4px 2px}
.card{position:relative;flex:none;width:84px;min-height:92px;border-radius:14px;border:1px solid var(--ui-line);background:transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 4px;font-size:13px}
.card:hover{background:var(--ui-line)}
.card .ico{width:52px;height:52px;display:flex;align-items:center;justify-content:center}
.card .ico svg,.card .ico img{width:100%;height:100%;object-fit:contain;display:block}
.card{touch-action:pan-x}
.card img{-webkit-user-drag:none;pointer-events:none}
.ghostdrag{position:fixed;z-index:20;width:68px;height:68px;pointer-events:none;transform:translate(-50%,-85%);filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.ghostdrag svg,.ghostdrag img{width:100%;height:100%;object-fit:contain;display:block}
.card .x{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;border:1px solid var(--ui-line);
  background:var(--ui-bg);font-size:15px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center;color:var(--ink-soft)}
.emptyrow{font-size:14px;color:var(--ink-soft);line-height:1.6;padding:6px 2px}

/* selection bar */
.selbar{position:fixed;left:50%;bottom:calc(var(--dock-h) + 8px);transform:translateX(-50%);z-index:4;width:min(330px,calc(100vw - 16px));
  display:flex;gap:6px;padding:8px;border-radius:16px;background:var(--ui-bg);border:1px solid var(--ui-line);backdrop-filter:blur(8px)}
.selbar button{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--ui-line);background:transparent;font-size:14px;padding:0 4px}
.selbar button:hover{background:var(--ui-line)}
.selbar .danger{color:var(--heart)}

.banner{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top));transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:10px;
  padding:6px 8px 6px 16px;border-radius:999px;background:var(--ui-bg);border:1px solid var(--ui-line);font-size:14px;white-space:nowrap;backdrop-filter:blur(8px)}
.banner .ghost{min-height:36px;border-radius:999px;padding:0 14px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(var(--dock-h) + 70px);transform:translateX(-50%);z-index:7;max-width:calc(100vw - 32px);
  padding:10px 16px;border-radius:12px;background:var(--ui-bg);border:1px solid var(--ui-line);font-size:14px;line-height:1.5;text-align:center}

/* weather + clock chip */
.chip{position:fixed;left:10px;top:calc(10px + env(safe-area-inset-top));z-index:4;display:flex;align-items:center;gap:8px;
  padding:6px 12px 6px 8px;border-radius:14px;border:1px solid var(--ui-line);background:var(--ui-bg);backdrop-filter:blur(8px);text-align:left;max-width:calc(50vw - 36px)}
.chip .wi{font-size:24px;line-height:1}
.chip .wt{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.chip b{font-size:14px;font-weight:700}
.chip span{font-size:12px;color:var(--ink-soft);white-space:nowrap;font-variant-numeric:tabular-nums}


.empty{position:fixed;left:50%;top:52%;transform:translate(-50%,-50%);width:min(350px,calc(100vw - 32px));z-index:3;
  padding:26px 24px;border-radius:20px;background:var(--ui-bg);border:1px solid var(--ui-line);text-align:center;backdrop-filter:blur(8px)}
.empty h1{margin:0 0 8px;font-size:24px;line-height:1.3;font-weight:700}
.empty p{margin:0 0 18px;color:var(--ink-soft);font-size:15px;line-height:1.7}
.empty .stack{display:flex;flex-direction:column;gap:8px}

/* photo prep dialog */
.prep{position:fixed;inset:0;z-index:10;background:rgba(10,18,14,.7);display:flex;align-items:center;justify-content:center;padding:14px}
.prepBox{width:min(380px,100%);max-height:100%;overflow:auto;background:var(--ui-bg);border:1px solid var(--ui-line);border-radius:20px;padding:18px}
.prepBox h2{margin:0 0 4px;font-size:19px;font-weight:700}
.prepBox p{margin:0 0 12px;font-size:14px;line-height:1.6;color:var(--ink-soft)}
.view{border-radius:14px;overflow:hidden;line-height:0;background:conic-gradient(var(--check) 25%,transparent 0 50%,var(--check) 0 75%,transparent 0) 0 0/20px 20px}
#prepCv{width:100%;height:auto;aspect-ratio:1/1;touch-action:none}
#prepCv.draw{cursor:crosshair}
.ctl{margin-top:14px}
.ctl label{display:flex;justify-content:space-between;font-size:14px;font-weight:500;margin-bottom:4px}
.ctl output{color:var(--ink-soft)}
input[type=range]{width:100%;height:32px;accent-color:var(--accent);margin:0}
.btns{display:flex;gap:8px;margin-top:12px}
.btns>*{flex:1}
</style>
</head>
<body>
<canvas id="stage" role="img" aria-label="草地飼養環境,你的角色和道具會在裡面互動"></canvas>

<button class="chip" id="chip" aria-label="天氣與時間,點一下換天氣">
  <span class="wi" id="wIco">☀️</span>
  <span class="wt"><b id="wName">晴天</b><span id="wTime">早上 08:00</span></span>
</button>


<section class="empty" id="empty" hidden>
  <h1>草地空空的</h1>
  <p>點下面的「角色」或「道具」把東西放進來,或先放回三隻內建的皮卡丘。</p>
  <div class="stack">
    <button class="primary" id="demo">放入內建的皮卡丘</button>
  </div>
</section>

<div class="banner" id="banner" hidden>
  <span id="bannerText"></span>
  <button class="ghost" id="bannerCancel">取消</button>
</div>
<div class="toast" id="toast" hidden></div>

<div class="tray" id="tray" hidden>
  <h2 id="trayTitle"></h2>
  <div class="row" id="trayRow"></div>
</div>

<div class="selbar" id="selbar" hidden>
  <button id="sFlip">翻轉</button>
  <button id="sDel" class="danger">收起來</button>
  <button id="sDone">完成</button>
</div>

<nav class="dock" id="dock">
  <button id="dProps" aria-label="放置道具">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="5"/><path d="M12 13.5v3.5"/><path d="M8 21l4-4 4 4"/></svg>
    道具
  </button>
  <button id="dChars" aria-label="放置角色">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14c1 1.5 2.2 2.2 3.5 2.2s2.5-.7 3.5-2.2"/><circle cx="9" cy="10" r=".6" fill="currentColor"/><circle cx="15" cy="10" r=".6" fill="currentColor"/></svg>
    角色
  </button>
  <button id="dClear" class="danger" aria-label="全部移除">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4.5h6V7"/><path d="M6.5 7l1 13h9l1-13"/><path d="M10 11v5M14 11v5"/></svg>
    全部移除
  </button>
</nav>

<div class="prep" id="prep" hidden>
  <div class="prepBox">
    <h2>先去背,再放進草地</h2>
    <p id="prepMsg">先用自動去背處理。還有殘留的地方,按「手動描邊」,把要留下的部分圈起來。</p>
    <div class="view"><canvas id="prepCv" width="320" height="320"></canvas></div>
    <div class="ctl" id="tolRow">
      <label for="tol">自動去背強度 <output id="tolOut"></output></label>
      <input type="range" id="tol" min="0" max="120" step="1">
    </div>
    <div id="gPreview">
      <div class="btns">
        <button class="ghost" id="pCancel">取消</button>
        <button class="ghost" id="pLasso">手動描邊</button>
      </div>
      <div class="btns">
        <button class="primary" id="pChar">加為角色</button>
        <button class="ghost" id="pProp">加為道具</button>
      </div>
    </div>
    <div class="btns" id="gLasso" hidden>
      <button class="ghost" id="lBack">返回</button>
      <button class="ghost" id="lRedo">重畫</button>
      <button class="primary" id="lDone">完成</button>
    </div>
  </div>
</div>

<input type="file" id="file" accept="image/*" hidden>

  /* ================= photo -> cut-out ================= */
  function makeSprite(orig, tol){
    const w = orig.width, h = orig.height;
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d', {willReadFrequently:true}); x.drawImage(orig, 0, 0);
    if (tol <= 0) return c;
    const id = x.getImageData(0, 0, w, h), d = id.data;
    const refs = [];
    const bs = Math.max(2, Math.round(Math.min(w, h)*0.03));
    for (const [cx, cy] of [[0,0],[w-bs,0],[0,h-bs],[w-bs,h-bs]]){
      let r = 0, g = 0, b = 0, n = 0;
      for (let j = 0; j < bs; j++) for (let i = 0; i < bs; i++){
        const k = ((cy + j)*w + cx + i)*4;
        if (d[k+3] > 128){ r += d[k]; g += d[k+1]; b += d[k+2]; n++; }
      }
      if (n) refs.push([r/n, g/n, b/n]);
    }
    if (!refs.length) refs.push([0, 0, 0]);
    const dist = k => {
      if (d[k+3] < 128) return 0;
      let m = 1e9;
      for (const q of refs){ const v = Math.hypot(d[k]-q[0], d[k+1]-q[1], d[k+2]-q[2]); if (v < m) m = v; }
      return m;
    };
    const seen = new Uint8Array(w*h), stack = [];
    const push = i => { if (!seen[i] && dist(i*4) < tol){ seen[i] = 1; stack.push(i); } };
    for (let i = 0; i < w; i++){ push(i); push((h-1)*w + i); }
    for (let j = 0; j < h; j++){ push(j*w); push(j*w + w - 1); }
    while (stack.length){
      const i = stack.pop(), px = i % w, py = (i / w) | 0;
      if (px > 0) push(i-1); if (px < w-1) push(i+1);
      if (py > 0) push(i-w); if (py < h-1) push(i+w);
    }
    let removed = 0;
    for (let i = 0; i < w*h; i++) if (seen[i]) removed++;
    if (removed > w*h*0.93) return c;
    for (let py = 0; py < h; py++) for (let px = 0; px < w; px++){
      const i = py*w + px;
      if (seen[i]){ d[i*4+3] = 0; continue; }
      const nb = (px>0 && seen[i-1]) || (px<w-1 && seen[i+1]) || (py>0 && seen[i-w]) || (py<h-1 && seen[i+w]);
      if (nb) d[i*4+3] = d[i*4+3]*0.55;
    }
    x.putImageData(id, 0, 0);
    return cropAlpha(c) || c;
  }

  function cropAlpha(c){
    const w = c.width, h = c.height;
    const d = c.getContext('2d', {willReadFrequently:true}).getImageData(0, 0, w, h).data;
    let x0 = w, y0 = h, x1 = 0, y1 = 0;
    for (let py = 0; py < h; py++) for (let px = 0; px < w; px++){
      if (d[(py*w + px)*4 + 3] > 20){ if (px<x0)x0=px; if (px>x1)x1=px; if (py<y0)y0=py; if (py>y1)y1=py; }
    }
    if (x1 <= x0 || y1 <= y0) return null;
    const pad = 2; x0 = Math.max(0, x0-pad); y0 = Math.max(0, y0-pad); x1 = Math.min(w-1, x1+pad); y1 = Math.min(h-1, y1+pad);
    const o = document.createElement('canvas'); o.width = x1-x0+1; o.height = y1-y0+1;
    o.getContext('2d').drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
    return o;
  }

  function encode(canvas){
    for (const m of [240, 190, 140]){
      const s = Math.min(1, m/Math.max(canvas.width, canvas.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(canvas.width*s)); c.height = Math.max(1, Math.round(canvas.height*s));
      c.getContext('2d').drawImage(canvas, 0, 0, c.width, c.height);
      let u = c.toDataURL('image/webp', .85);
      if (!u.startsWith('data:image/webp')) u = c.toDataURL('image/png');
      if (u.length < 170000) return u;
    }
    return null;
  }

  function addLib(kind, img, id, opt){
    const e = {id: id || uid(), kind, img, ready: false, mode: 'roam', ...(opt || {})};
    e.im = new Image();
    let need = 1 + (e.cheer ? 6 : 0);
    const done = () => { if (--need === 0) e.ready = true; };
    e.im.onload = () => { e.sw = e.im.naturalWidth; e.sh = e.im.naturalHeight; if (!e.builtin && e.kind === 'char') dropOldHat(e); done(); };
    if (e.closed){ e.closedIm = new Image(); e.closedIm.src = e.closed; }
    if (e.cheer){
      e.ch = {};
      for (const k of ['up', 'L', 'R']){ const im = new Image(); im.onload = done; im.src = e.cheer[k]; e.ch[k] = im; }
      e.ears = {};
      for (const [k, src] of [['base', e.cheer.noears], ['L', e.cheer.earL], ['R', e.cheer.earR]]){ const im = new Image(); im.onload = done; im.src = src; e.ears[k] = im; }
    }
    e.im.src = img;

  const OLD_HAT = '1110111111111111111011111111111111111001110111001110000000011001110000000000001111000100000001111111011000000111101000000000001111000000000001111100000000001111111100000001111111111000000111111111101000011111100000000000111110000000000011111110000000111111';
  function dropOldHat(e){
    try {
      const c = document.createElement('canvas'); c.width = c.height = 16;
      const x = c.getContext('2d', {willReadFrequently: true}); x.fillStyle = '#fff'; x.fillRect(0, 0, 16, 16); x.drawImage(e.im, 0, 0, 16, 16);
      const d = x.getImageData(0, 0, 16, 16).data, g = [];
      for (let i = 0; i < d.length; i += 4) g.push(d[i]*.299 + d[i+1]*.587 + d[i+2]*.114);
      const mean = g.reduce((a, b) => a + b, 0)/g.length;
      let diff = 0; g.forEach((v, i) => { if ((v > mean ? '1' : '0') !== OLD_HAT[i]) diff++; });
      if (diff > 24) return;
      lib.splice(lib.indexOf(e), 1);
      for (let i = items.length - 1; i >= 0; i--) if (items[i].ref === e.id) items.splice(i, 1);
      if (sel && !items.includes(sel)) sel = null;
      saveAll(); refreshUI();
    } catch(err){}
  }

  function newItem(o){
    let [x0, x1, y0, y1] = viewGround();
    if (x1 <= x0 || y1 <= y0){ [x0, x1] = gx(); [y0, y1] = gy(); }
    const it = {
      id: o.id || uid(), type: o.type, ref: o.ref,
      size: o.size ?? (o.type === 'deco' ? .8 : 1), flip: !!o.flip,
      x: o.x ?? rand(x0, x1), y: o.y ?? rand(y0, y1),
      col: o.col || BALLOON_COLS[(Math.random()*BALLOON_COLS.length)|0], hc: o.hc ?? ((Math.random()*HOT_COLS.length)|0), ph: rand(0, 6.28),
      state: 'idle', timer: rand(.3, 1), t: rand(0, 6), face: Math.random() < .5 ? 1 : -1,
      jh: o.drop && !reduce ? rand(180, 260) : 0, jv: 0, squash: 0, hops: 0, cool: 0, splT: 0, inPond: false, carry: null
    };
    it.tx = it.x; it.ty = it.y;
    if (it.type === 'sand') it.by = null;
    if (it.type === 'house'){ it.fa = 1; it.hover = false; it.bedBy = null; it.sofaBy = null; }
    if (it.type === 'hotair'){ it.alt = 0; it.hs = 'ground'; it.rider = null; it.cool = 0; it.burn = 0; it.vx = 0; it.vy = 0; it.noteT = 5; }
    if (it.type === 'char' || it.type === 'deco') it.lb = libById(it.ref);
    const lb = it.lb;
    if (it.type === 'char' && lb){
      if (lb.builtin && o.size === undefined) it.size = lb.size || 1;
      if (lb.mode === 'sleep'){ it.sleeper = true; it.state = 'sleep'; it.face = 1; it.zT = rand(.2, 1.2); it.stir = 0; }
      if (lb.mode === 'sit'){ it.sitter = true; it.state = 'sit'; it.face = 1; it.waveOn = false; it.waveT = rand(1.5, 3.5); it.wv = 0; it.wph = 0; it.fast = 0; }
    }
    return it;
  }

  function saveAll(){
    try {
      for (const it of items) toNorm(it);
      localStorage.setItem(KEY, JSON.stringify({
        lib: lib.filter(l => !l.builtin).map(l => ({id: l.id, kind: l.kind, img: l.img})),
        items: items.map(i => ({id: i.id, type: i.type, ref: i.ref, size: i.size, flip: i.flip, nx: i.nx, ny: i.ny, col: i.col, hc: i.hc,
          home: i.home ? i.home.id : undefined, fl: i.in ? i.in.fl : undefined, lx: i.in ? i.in.lx : undefined, bed: i.in ? i.in.mode === 'bed' : undefined, sofa: i.in ? i.in.mode === 'sofa' : undefined}))

    } catch(e){ toast('存檔空間不夠了,先刪掉一些角色。'); }
  }
  let saveT;
  const saveSoon = () => { clearTimeout(saveT); saveT = setTimeout(saveAll, 400); };

  function placeBuiltins(){
    const [vx0, vx1, vy0, vy1] = viewGround();
    for (const b of BUILTINS){
      if (items.some(i => i.ref === b.id)) continue;
      items.push(newItem({type: 'char', ref: b.id, x: lerp(vx0, vx1, b.at[0]), y: lerp(vy0, vy1, b.at[1])}));
    }
  }

  function loadAll(){
    try {
      const raw = localStorage.getItem(KEY);
      if (raw){
        const d = JSON.parse(raw);
        for (const l of d.lib || []) if (l && l.id && l.img && !libById(l.id)) addLib(l.kind === 'prop' ? 'prop' : 'char', l.img, l.id);
        const homes = [];
        for (const i of d.items || []){
          if ((i.type === 'char' || i.type === 'deco') && !libById(i.ref)) continue;
          const it = newItem({...i}); it.nx = i.nx; it.ny = i.ny; fromNorm(it); items.push(it);
          if (i.home) homes.push([it, i]);
        }
        for (const it of items) if (it.type === 'char' && (it.sitter || it.sleeper) && !it.home) trySand(it);
        for (const [it, i] of homes){
          const h = items.find(q => q.id === i.home && q.type === 'house');
          if (h){ enterHouse(it, h, i.fl || 1, i.lx ?? HS.door, !!i.bed); if (i.sofa && !h.sofaBy) startSofa(it, h); }
        }
        return;
      }
      // bring over the meadow from the earlier (one-screen) version into the middle of the big meadow
      const old = localStorage.getItem('meadow3');
      if (old){
        const d = JSON.parse(old), [y0, y1] = gy();
        const oy0 = H*.36 + H*.64*.1, oy1 = H - dockH - 6;
        for (const l of d.lib || []) if (l && l.id && l.img && !libById(l.id)) addLib(l.kind === 'prop' ? 'prop' : 'char', l.img, l.id);
        for (const i of d.items || []){
          if ((i.type === 'char' || i.type === 'deco') && !libById(i.ref)) continue;
          const x = camX + (i.nx ?? .5)*W, y = camY + oy0 + (i.ny ?? .5)*(oy1 - oy0);
          items.push(newItem({...i, x: clamp(x, ...gx()), y: clamp(y, y0, y1)}));
        }
        placeBuiltins(); saveAll(); return;
      }
      const old2 = JSON.parse(localStorage.getItem('meadow2') || '[]');
      if (Array.isArray(old2)) for (const o of old2){
        if (!o || !o.id || !o.img) continue;
        const e = addLib('char', o.img, o.id);
        items.push(newItem({type: 'char', ref: e.id, size: o.size, flip: o.flip}));
      }
      placeBuiltins();
    } catch(e){}
  }

  /* ================= drawing helpers for items ================= */
  const CHAR_K = .85;      // characters are drawn a little smaller than props
  function dims(p){
    const U = baseU()*p.size*depth(p.y)*CHAR_K, ar = p.lb.sw/p.lb.sh;
    return ar >= 1 ? {w: U, h: U/ar, s: depth(p.y), U} : {w: U*ar, h: U, s: depth(p.y), U};
  }
  const Ug = it => baseU()*it.size*depth(it.y);
  const treeH = it => Ug(it)*1.3;
  const treeR = it => Ug(it)*.5;
  const treeTop = it => treeH(it)*.72 + treeR(it)*.9;
  const pondRx = it => Ug(it)*.95;

  function balloonGeom(it, t){
    const U = Ug(it), str = U*.85, bw = U*.3, bh = U*.4, sw = 1 + wx.wind*3;
    return {U, str, bw, bh, bx: it.x + Math.sin(t*1.3*(1 + wx.wind) + it.ph)*U*.05*sw + wx.wind*U*.12, by: it.y - str - bh + Math.sin(t*1.7 + it.ph)*U*.04};
  }

  function drawBalloonShape(bx, by, bw, bh, col){
    ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(bx, by, bw, bh, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(bx, by + bh - 1); ctx.lineTo(bx - bw*.16, by + bh + bw*.22); ctx.lineTo(bx + bw*.16, by + bh + bw*.22); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.ellipse(bx - bw*.35, by - bh*.35, bw*.16, bh*.26, -.5, 0, 7); ctx.fill();
  }

  function drawBalloon(it){
    const g = balloonGeom(it, T);
    ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(it.x, it.y, g.U*.16, g.U*.05, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = '#52645A'; ctx.lineWidth = Math.max(1, g.U*.012); ctx.beginPath();
    ctx.moveTo(it.x, it.y - 2); ctx.quadraticCurveTo((it.x + g.bx)/2 + g.U*.05, it.y - g.str*.5, g.bx, g.by + g.bh + g.bw*.22); ctx.stroke();

  }

  function drawTree(it){
    const U = Ug(it), h = treeH(it), R = treeR(it), w = U*.24;
    ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(it.x, it.y, U*.55, U*.14, 0, 0, 7); ctx.fill();
    const sk = wx.wind*(.1 + .12*Math.sin(T*(1.5 + wx.wind*3) + it.ph)) + .02*Math.sin(T*.9 + it.ph);
    ctx.save(); ctx.translate(it.x, it.y); ctx.transform(1, 0, -sk, 1, 0, 0); ctx.translate(-it.x, -it.y);
    ctx.fillStyle = NAT.trunk; ctx.beginPath();
    ctx.moveTo(it.x - w*.6, it.y); ctx.quadraticCurveTo(it.x - w*.32, it.y - h*.4, it.x - w*.3, it.y - h*.75);
    ctx.lineTo(it.x + w*.3, it.y - h*.75); ctx.quadraticCurveTo(it.x + w*.32, it.y - h*.4, it.x + w*.6, it.y); ctx.closePath(); ctx.fill();
    const cy = it.y - h*.72;
    const blobs = [[0, .28, .8], [-.62, .12, .66], [.62, .12, .66], [-.3, -.35, .68], [.32, -.33, .64], [0, -.05, .82]];
    ctx.fillStyle = NAT.leafB;
    for (const [bx, by, br] of blobs){ ctx.beginPath(); ctx.arc(it.x + bx*R, cy + by*R, br*R, 0, 7); ctx.fill(); }
    ctx.fillStyle = NAT.leafA;
    for (const [bx, by, br] of blobs){ ctx.beginPath(); ctx.arc(it.x + bx*R - R*.06, cy + by*R - R*.09, br*R*.86, 0, 7); ctx.fill(); }
    ctx.restore();
  }

  function drawPond(it){
    const rx = pondRx(it), ry = rx*.3;
    ctx.fillStyle = NAT.waterEdge; ctx.beginPath(); ctx.ellipse(it.x, it.y, rx*1.08, ry*1.12, 0, 0, 7); ctx.fill();
    const g = ctx.createLinearGradient(0, it.y - ry, 0, it.y + ry);
    g.addColorStop(0, NAT.water); g.addColorStop(1, NAT.waterDeep);
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(it.x, it.y, rx, ry, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = Math.max(1, rx*.015);
    for (let k = 0; k < 2; k++){
      const f = ((T*.25 + k*.5 + it.ph) % 1);
      ctx.globalAlpha = (1 - f)*.7;
      ctx.beginPath(); ctx.ellipse(it.x + rx*.15, it.y, rx*.7*f + rx*.05, ry*.7*f + ry*.05, 0, 0, 7); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.ellipse(it.x - rx*.35, it.y - ry*.35, rx*.22, ry*.16, 0, 0, 7); ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fill();
  }

  /* ---------- hot-air balloon ---------- */
  const HOT_K = 1.6;        // hot-air balloon size, so its passenger is about as big as the Pikachus outside
  function hotGeom(it){
    const U = Ug(it)*HOT_K, R = U*.5, bw = U*.34, bh = U*.24;
    const by = it.y - it.alt, top = by - bh, ey = top - U*.22 - R*1.38;
    const sway = Math.sin(T*1.2 + it.ph)*(.025 + wx.wind*.09) + wx.wind*.06*(it.alt > 5 ? 1 : .25);
    return {U, R, bw, bh, by, top, ey, sway};
  }
  function hotShadow(it){
    const g = hotGeom(it), f = 1 - Math.min(it.alt, 500)/650;
    ctx.fillStyle = `rgba(0,0,0,${.22*f})`; ctx.beginPath(); ctx.ellipse(it.x, it.y, g.U*.32*f + 4, g.U*.08*f + 2, 0, 0, 7); ctx.fill();
  }
  function drawHotAir(it){
    const g = hotGeom(it), x = it.x, {U, R, bw, bh, top, ey} = g, C = HOT_COLS[it.hc % HOT_COLS.length];
    if (it.alt < 2) hotShadow(it);
    ctx.save(); ctx.translate(x, ey); ctx.rotate(g.sway); ctx.translate(-x, -ey);
    // ropes
    ctx.strokeStyle = '#6B5438'; ctx.lineWidth = Math.max(1, U*.012);
    for (const s of [-1, 1]){ ctx.beginPath(); ctx.moveTo(x + s*R*.17, ey + R*1.37); ctx.lineTo(x + s*bw*.44, top); ctx.stroke(); }
    // burner flame
    if (it.burn > 0){
      const fh = U*(.1 + .04*Math.sin(T*40)), fy = top - U*.06;
      ctx.fillStyle = 'rgba(255,180,60,.9)'; ctx.beginPath(); ctx.moveTo(x - U*.035, fy); ctx.quadraticCurveTo(x, fy - fh*1.6, x + U*.035, fy); ctx.fill();
      ctx.fillStyle = 'rgba(255,240,150,.95)'; ctx.beginPath(); ctx.moveTo(x - U*.018, fy); ctx.quadraticCurveTo(x, fy - fh, x + U*.018, fy); ctx.fill();
    }
    // envelope
    ctx.beginPath();
    ctx.moveTo(x - R*.18, ey + R*1.25);
    ctx.bezierCurveTo(x - R*.5, ey + R*.9, x - R*1.02, ey + R*.35, x - R, ey);
    ctx.ellipse(x, ey, R, R*1.05, 0, Math.PI, 0);
    ctx.bezierCurveTo(x + R*1.02, ey + R*.35, x + R*.5, ey + R*.9, x + R*.18, ey + R*1.25);
    ctx.closePath();
    ctx.fillStyle = C[0]; ctx.fill();
    ctx.save(); ctx.clip();
    ctx.fillStyle = C[1]; ctx.beginPath(); ctx.ellipse(x, ey + R*.1, R*.6, R*1.45, 0, 0, 7); ctx.fill();
    ctx.fillStyle = C[2]; ctx.beginPath(); ctx.ellipse(x, ey + R*.1, R*.2, R*1.45, 0, 0, 7); ctx.fill();
    ctx.fillStyle = C[3]; ctx.fillRect(x - R*1.1, ey + R*.55, R*2.2, R*.14);
    ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.beginPath(); ctx.ellipse(x - R*.45, ey - R*.4, R*.18, R*.42, -.35, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.beginPath(); ctx.ellipse(x + R*.75, ey + R*.15, R*.5, R*1.2, 0, 0, 7); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#5A3B22'; ctx.beginPath();
    ctx.moveTo(x - R*.19, ey + R*1.24); ctx.lineTo(x + R*.19, ey + R*1.24); ctx.lineTo(x + R*.15, ey + R*1.38); ctx.lineTo(x - R*.15, ey + R*1.38); ctx.closePath(); ctx.fill();
    // rider sits in the basket
    let rider = null;
    if (it.rider && it.rider.lb && it.rider.lb.ready) rider = drawRider(it.rider, x, top, bw, bh, it.look || it.face || 1);
    // basket
    ctx.fillStyle = '#9B6B3E'; ctx.beginPath();
    ctx.moveTo(x - bw/2, top); ctx.lineTo(x + bw/2, top); ctx.lineTo(x + bw*.42, top + bh); ctx.lineTo(x - bw*.42, top + bh); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(70,45,20,.45)'; ctx.lineWidth = Math.max(1, U*.01);
    for (let i = 1; i < 4; i++){ const yy = top + bh*i/4; ctx.beginPath(); ctx.moveTo(x - bw*(.5 - .08*i/4), yy); ctx.lineTo(x + bw*(.5 - .08*i/4), yy); ctx.stroke(); }
    for (let i = -2; i <= 2; i++){ ctx.beginPath(); ctx.moveTo(x + i*bw*.18, top); ctx.lineTo(x + i*bw*.15, top + bh); ctx.stroke(); }
    ctx.fillStyle = '#6E4A28'; ctx.fillRect(x - bw*.53, top - bh*.1, bw*1.06, bh*.16);
    if (rider && it.hs === 'fly' && it.scope) drawScope(rider, it);
    ctx.restore();
  }
  function drawRider(p, cx, top, bw, bh, dir){
    const ar = p.lb.sw/p.lb.sh;
    let rh = bh*2.25, rw = rh*ar;
    if (rw > bw*1.45){ rw = bw*1.45; rh = rw/ar; }
    const bottom = top + bh*.55;
    ctx.save(); ctx.translate(cx, bottom); ctx.scale(dir*(p.flip ? -1 : 1), 1 + .025*Math.sin(p.t));
    ctx.drawImage(p.lb.im, -rw/2, -rh, rw, rh);
    ctx.restore();
    return {cx, rw, rh, bottom, dir};
  }
  function drawScope(r, it){
    const {cx, rw, rh, bottom, dir} = r, len = Math.max(rh*.62, 12);
    const ex = cx + dir*rw*.12, ey = bottom - rh*.72;
    const an = -.28 + Math.sin(T*.6 + it.ph)*.22 + Math.sin(T*1.7 + it.ph)*.05, dx = dir*Math.cos(an), dy = Math.sin(an);
    const P = f => [ex + dx*len*f, ey + dy*len*f];

  }

  /* ---------- house ---------- */
  // layout in "U" units (U = the house's size on screen); x is measured from the house centre
  const HS = {W: 2.4, fh: .8, slab: .06, wall: .06, roof: .64, door: .12, stairB: 1.0, stairT: .5, sofaL: -1.02, sofaR: -.38, sofaX: -.7,
              bedL: -1.1, bedR: -.32, f1: [-1.0, 1.0], f2: [-1.0, .44]};
  const MAX_IN = 5;
  const HOUSE_K = CHAR_K/.54;   // house size, so Pikachus inside are as big as the ones outside
  function houseGeom(h){
    const U = Ug(h)*HOUSE_K, W = U*HS.W, G = h.y;
    const f1 = G - U*.04, f2 = G - U*(HS.fh + HS.slab), top = f2 - U*HS.fh;
    return {U, W, L: h.x - W/2, R: h.x + W/2, G, f1, f2, top, apex: top - U*HS.roof, mt: f2 - U*.2};
  }
  const HX = (h, g, lx) => h.x + lx*g.U;
  const insideOf = h => items.filter(c => c.type === 'char' && c.home === h);
  function houseAt(x, y){
    let best = null;
    for (const h of items){
      if (h.type !== 'house') continue;
      const g = houseGeom(h);
      if (x > g.L && x < g.R && y > g.top - g.U*.1 && y < g.G + g.U*.05 && (!best || h.y > best.y)) best = h;
    }
    return best;
  }
  function inDims(p, g){
    const B = g.U*.54*Math.sqrt(p.size), ar = p.lb.sw/p.lb.sh;
    return ar >= 1 ? {w: B, h: B/ar} : {w: B*ar, h: B};
  }
  function inPos(p){
    const h = p.home, g = houseGeom(h), I = p.in;
    if (I.mode === 'up' || I.mode === 'down'){ const s = clamp(I.s, 0, 1); return {x: HX(h, g, lerp(HS.stairB, HS.stairT, s)), y: lerp(g.f1, g.f2, s)}; }
    return {x: HX(h, g, I.lx), y: I.fl === 1 ? g.f1 : g.f2};
  }
  function enterHouse(p, h, fl, lx, bed){
    if (p.home && p.home.bedBy === p) p.home.bedBy = null;
    if (p.home && p.home.sofaBy === p) p.home.sofaBy = null;
    p.home = h; p.state = 'inside'; p.jv = 0; p.jh = 0; p.carry = null; p.goHouse = null; p.inPond = false;
    p.in = {fl, lx, tx: lx, mode: 'idle', timer: rand(.5, 1.5), stay: rand(35, 70), bedCool: 0, sofaCool: 0, s: 0, then: null};
    if (bed && !h.bedBy) startBed(p, h);
    const q = inPos(p); p.x = q.x; p.y = q.y;
  }
  function startSofa(p, h){ h.sofaBy = p; p.in.mode = 'sofa'; p.in.fl = 1; p.in.lx = HS.sofaX; p.in.timer = (p.sleeper || p.sitter) ? Infinity : rand(10, 18); p.zT = .8; p.jv = 0; p.jh = 0; p.wv = 0; p.earT = rand(.5, 2); }
  function startBed(p, h){ h.bedBy = p; p.in.mode = 'bed'; p.in.fl = 2; p.in.timer = (p.sleeper || p.sitter) ? Infinity : rand(14, 24); p.zT = .6; p.jv = 0; p.jh = 0; }
  function leaveHouse(p){
    const h = p.home, [x0, x1] = gx(), [y0, y1] = gy();
    if (h && h.bedBy === p) h.bedBy = null;
    if (h && h.sofaBy === p) h.sofaBy = null;
    if (h && items.includes(h)){ const g = houseGeom(h); p.x = clamp(HX(h, g, HS.door), x0, x1); p.y = clamp(h.y + g.U*.08, y0, y1); }
    p.home = null; p.in = null; p.state = 'idle'; p.timer = rand(.6, 1.4); p.cool = 12; p.jh = 0; p.jv = 0; p.face = 1;
    p.tx = p.x; p.ty = p.y;
  }
  // drop a character into the house where the finger / mouse is
  function putInHouse(p, h, x, y){
    const g = houseGeom(h), fl = y < g.f2 + g.U*.05 ? 2 : 1, r = fl === 1 ? HS.f1 : HS.f2;
    let lx = clamp((x - h.x)/g.U, r[0], r[1]);
    const onBed = fl === 2 && lx < HS.bedR, onSofa = fl === 1 && lx > HS.sofaL - .02 && lx < HS.sofaR + .02;
    const bed = onBed && (!h.bedBy || h.bedBy === p), sofa = onSofa && (!h.sofaBy || h.sofaBy === p);
    // somebody is already there: stand next to it instead of piling on top

  function drawBed(h, g){

      const im = p.sleeper ? lb.im : sleepLb.im, ar = p.sleeper ? lb.sw/lb.sh : sleepLb.sw/sleepLb.sh;

  function drawSofaSitter(p, h, g){

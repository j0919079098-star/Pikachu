    const hot = props.filter(q => q.type === 'hotair' && Math.hypot(q.x - p.x, q.y - p.y) < 900);
    const [x0, x1] = gx(), [y0, y1] = gy();
    if (hot.length && p.cool <= 0 && r < .22){
      const q = hot[(Math.random()*hot.length)|0];
      p.state = Math.random() < .5 ? 'walk' : 'run'; p.tx = q.x; p.ty = q.y + 3;
    } else if (props.length && r < .42){
      const q = props[(Math.random()*props.length)|0];
      p.state = Math.random() < .55 ? 'walk' : 'run';
      if (q.type === 'pond'){ const rx = pondRx(q); p.tx = q.x + rand(-.5, .5)*rx; p.ty = q.y + rand(-.4, .4)*rx*.3; }
      else { p.tx = q.x; p.ty = q.y + 3; }
    } else if (r < .7){
      const t = Math.random();
      p.state = t < .5 ? 'walk' : t < .8 ? 'run' : 'crawl';
      const ang = rand(0, 6.283), dd = rand(90, 380)*k;
      p.tx = p.x + Math.cos(ang)*dd; p.ty = p.y + Math.sin(ang)*dd*.5;
    } else if (r < .85){
      p.state = 'hop'; p.hops = (Math.random()*3) | 0; p.jv = 520*k*M; return;
    } else {
      p.timer = rand(1, 3.2);
      if (Math.random() < .35) p.face *= -1;
      return;
    }
    p.tx = clamp(p.tx, x0, x1); p.ty = clamp(p.ty, y0, y1);
  }

  function startFall(p, lx, ly){
    const [x0, x1] = gx(), [y0, y1] = gy();
    lx = clamp(lx ?? p.x + rand(-160, 160), x0, x1); ly = clamp(ly ?? p.y + rand(-40, 40), y0, y1);
    const Tt = Math.sqrt(2*Math.max(p.jh, 1)/1100) + .02;
    p.vx = (lx - p.x)/Tt; p.vy = (ly - p.y)/Tt; p.jv = 0; p.state = 'fall';
    if (Math.abs(p.vx) > 8) p.face = Math.sign(p.vx);
  }

  function startLift(p, b){
    items.splice(items.indexOf(b), 1);
    if (sel === b) sel = null;
    p.carry = {col: b.col, size: b.size}; p.state = 'lift'; p.liftV = 40;
    const targetY = Math.max(40, camY + 60/ZM);
    p.jhTop = Math.max(120, p.y - targetY); p.jv = 0;
    saveSoon(); refreshUI();
  }

  function startClimb(p, tr){
    p.state = 'climb'; p.phase = 'up'; p.tree = tr; p.jv = 0;
    p.topJh = Math.max(40, Math.min(treeTop(tr), tr.y - dims(p).h - 12));
  }

  function board(p, b){
    p.state = 'ride'; p.jv = 0; p.ride = b;
    b.rider = p; b.hs = 'up'; b.burn = 1; b.upV = 0;
    b.face = Math.random() < .5 ? 1 : -1;
    b.skyGoal = rand(HZ*.3, HZ*.85);
    heartsAt(p);
  }

  function checkProps(p, dt){
    if (p.cool <= 0 && p.jh < 8 && !raining() && trySand(p)) return;
    if (p.goHouse){
      const q = p.goHouse;
      if (!items.includes(q)) p.goHouse = null;
      else {
        const g = houseGeom(q);
        if (Math.abs(p.x - HX(q, g, HS.door)) < g.U*.2 && Math.abs(p.y - (q.y + g.U*.06)) < g.U*.16 && p.jh < 8){ enterHouse(p, q, 1, HS.door, false); return; }
      }
    }
    const s = depth(p.y);
    let wet = false;
    for (const q of items){
      if (!isProp(q)) continue;
      const U = Ug(q);
      if (q.type === 'pond'){
        const rx = pondRx(q), ry = rx*.3;
        if (((p.x - q.x)/rx)**2 + ((p.y - q.y)/ry)**2 < 1) wet = true;
      } else if (q.type === 'tree' && p.cool <= 0 && p.jh < 8){
        if (((p.x - q.x)/(U*.3))**2 + ((p.y - q.y)/(U*.14))**2 < 1){ startClimb(p, q); return; }
      } else if (q.type === 'balloon' && p.jh < 8){
        if (((p.x - q.x)/(U*.3))**2 + ((p.y - q.y)/(U*.14))**2 < 1){ startLift(p, q); return; }
      } else if (q.type === 'hotair' && hotFree(q) && p.cool <= 0 && p.jh < 8){
        if (((p.x - q.x)/(U*.36))**2 + ((p.y - q.y)/(U*.16))**2 < 1){ board(p, q); return; }
      }
    }
    if (wet && !p.inPond) splash(p.x, p.y, s, true);
    p.inPond = wet;
    if (wet && (p.state === 'walk' || p.state === 'run' || p.state === 'crawl')){
      p.splT -= dt;
      if (p.splT <= 0){ splash(p.x, p.y, s, false); p.splT = .16; }
    }
  }

  function gravity(p){
    return dt => {
      if (p.jh > 0 || p.jv !== 0){
        p.jv -= 1900*dt; p.jh += p.jv*dt;
        if (p.jh <= 0){ if (p.jv < -260) p.squash = clamp(-p.jv/2600, .08, .22); p.jh = 0; p.jv = 0; }
      }
    };
  }

  function sitAnim(p, dt, k){
    gravity(p)(dt);
    p.t += dt*1.4;
    p.waveT -= dt;
    if (p.waveT <= 0 && p.jh === 0){
      p.waveOn = !p.waveOn; p.waveT = p.waveOn ? rand(2.2, 3.6) : rand(2.5, 5);
      p.jv = (p.waveOn ? 330 : 200)*k*M; p.squash = .14;      // little hop when changing pose
    }
    if (p.jv > 0 || p.jh === 0) p.wv = p.waveOn ? 1 : 0;   // switch pose right as it hops (no ghosting)
    if (p.fast > 0) p.fast -= dt;
    p.wph += dt*(p.fast > 0 ? 13 : 8)*M;
  }

  const raining = () => wx.rain > .25;
  const umbrellaOn = p => raining() && !p.sleeper && !p.sitter && !['lift', 'climb', 'ride', 'inside'].includes(p.state);
  function stepChar(p, dt, k){
    p.squash *= Math.exp(-9*dt);
    p.umb = (p.umb || 0) + ((umbrellaOn(p) ? 1 : 0) - (p.umb || 0))*Math.min(1, dt*4);
    if (p.cool > 0) p.cool -= dt;
    const s = depth(p.y);

    if (p.state === 'held'){ p.jh += (26 - p.jh)*Math.min(1, dt*14); p.jv = 0; p.t += dt*2.4; return; }
    if (p.state === 'inside'){ stepInside(p, dt, k); return; }
    if (p.sandMode){ stepSand(p, dt, k); return; }

    if (p.sleeper){
      gravity(p)(dt);
      p.state = 'sleep'; p.t += dt*1.5;
      if (p.stir > 0) p.stir = Math.max(0, p.stir - dt);
      p.zT -= dt;
      if (p.zT <= 0 && p.jh === 0){
        p.zT = reduce ? 2.6 : 1.3;
        const {w, h} = dims(p), dir = p.flip ? -1 : 1;
        fx.push({k: 'txt', ch: 'Z', col: '#3E6FB0', x: p.x - w*.2*dir, y: p.y - h*.8, vx: -rand(8, 20)*dir, vy: -rand(26, 38)*s, life: 2.4, t0: 2.4, size: clamp(h*.28, 12, 34)});
      }
      return;
    }
    if (p.sitter){ p.state = 'sit'; sitAnim(p, dt, k); return; }
    if (p.state === 'ride'){
      const b = p.ride;
      if (!b || !items.includes(b) || b.rider !== p){ p.ride = null; startFall(p); return; }
      p.x = b.x; p.y = b.y + .01; p.jh = b.alt + hotGeom(b).bh*.6; p.t += dt*2;
      return;
    }
    if (p.state === 'lift'){
      p.t += dt*3;
      p.liftV = Math.min(360, p.liftV + 300*dt);
      p.jh += p.liftV*dt;
      p.x += Math.sin(p.t*1.6)*14*dt + wx.wind*60*dt;
      if (p.jh >= p.jhTop){
        const U = baseU()*p.carry.size*depth(p.y), h = dims(p).h;
        burst(p.x, p.y - p.jh - h - U*.35 - U*.4, p.carry.col);
        p.carry = null; startFall(p);
      }
      return;
    }
    if (p.state === 'climb'){
      const tr = p.tree;
      if (!items.includes(tr)){ startFall(p); return; }
      if (p.phase === 'up'){
        p.t += dt*10;
        p.x += (tr.x - p.x)*Math.min(1, dt*8); p.y = tr.y + 2;
        p.jh += Math.max(90, p.topJh/1.6)*dt;
        if (p.jh >= p.topJh){ p.jh = p.topJh; p.phase = 'top'; p.timer = .8; p.face *= -1; }
      } else {
        p.t += dt*3; p.timer -= dt;
        if (p.timer <= 0){
          const U = Ug(tr), side = Math.random() < .5 ? -1 : 1;
          p.cool = 6;
          startFall(p, tr.x + side*rand(1.3, 2.1)*U, tr.y + rand(-10, 36));
        }
      }
      return;
    }
    if (p.state === 'fall'){
      p.t += dt*2.4;
      p.jv -= 1100*dt; p.jh += p.jv*dt; p.x += p.vx*dt; p.y += p.vy*dt;
      if (p.jh <= 0){
        p.jh = 0; p.jv = 0; p.squash = .26; p.state = 'idle'; p.timer = rand(1, 2);
        p.tx = p.x; p.ty = p.y;
        if (p.inPond) splash(p.x, p.y, depth(p.y), true);
      }
      return;
    }

    if (p.jh > 0 || p.jv !== 0){
      p.jv -= 1900*dt; p.jh += p.jv*dt;
      if (p.jh <= 0){
        if (p.jv < -260) p.squash = clamp(-p.jv/2600, .08, .26);
        if (p.inPond && p.jv < -260) splash(p.x, p.y, s, true);
        p.jh = 0; p.jv = 0;
      }
    }

    switch (p.state){
      case 'idle':
        p.t += dt*2.4; p.timer -= dt;
        if (raining() && !p.goHouse && p.timer > .8) p.timer = .8;
        if (p.timer <= 0 && p.jh === 0) next(p, k);
        break;
      case 'hop':
        p.t += dt*2.4;
        if (p.jh === 0 && p.jv === 0){
          if (p.hops > 0){ p.hops--; p.jv = 520*k*M; }
          else { p.state = 'idle'; p.timer = rand(.6, 1.6); }
        }
        break;
      case 'walk': case 'run': case 'crawl': {
        const FREQ = {walk: 9, run: 15, crawl: 6}, SPEED = {walk: 78, run: 250, crawl: 42};
        p.t += dt*FREQ[p.state];
        const dx = p.tx - p.x, dy = p.ty - p.y, dist = Math.hypot(dx, dy);
        const step = SPEED[p.state]*k*s*(reduce ? .6 : 1)*(p.umb > .5 ? .6 : 1)*dt;
        if (dist <= step){ p.x = p.tx; p.y = p.ty; p.state = 'idle'; p.timer = rand(.6, 2.2); }
        else { p.x += dx/dist*step; p.y += dy/dist*step; if (Math.abs(dx) > 4) p.face = Math.sign(dx); }
        break;
      }
    }
    if (!busy(p) && p.state !== 'held') checkProps(p, dt);
  }

  function stepHot(b, dt, k){
    if (b.cool > 0) b.cool -= dt;
    if (b.rider && (!items.includes(b.rider) || b.rider.ride !== b)) b.rider = null;
    const [x0, x1] = gx(), [y0, y1] = gy();
    if (b.hs === 'ground'){ b.alt = 0; b.burn = 0; if (b.rider) b.rider = null; return; }
    if (b.hs === 'up'){
      b.burn = 1; b.scope = false; b.look = b.face;
      b.upV = Math.min(95*k, b.upV + 45*k*dt);
      b.alt += b.upV*dt*M;
      const goalAlt = b.y - b.skyGoal;
      if (b.alt >= goalAlt){ b.hs = 'fly'; b.flyT = rand(25, 42); b.vx = b.face*rand(22, 40)*k; b.vy = 0; b.driftT = 0; b.burn = 0; }
      return;
    }
    if (b.hs === 'fly'){
      b.driftT -= dt;
      if (b.driftT <= 0){
        b.driftT = rand(4, 9);
        if (Math.random() < .35) b.vx = -b.vx;
        b.vy = rand(-14, 14)*k;
        b.skyGoal = rand(HZ*.3, HZ*.85);
        if (Math.random() < .5) b.burn = rand(.6, 1.4);
      }
      if (b.burn > 0) b.burn -= dt;
      b.x += (b.vx + wx.wind*70*Math.sign(b.vx || 1))*dt*M; b.y += b.vy*dt*M;
      if (b.x < x0 + 60){ b.x = x0 + 60; b.vx = Math.abs(b.vx); }
      if (b.x > x1 - 60){ b.x = x1 - 60; b.vx = -Math.abs(b.vx); }
      b.y = clamp(b.y, y0, y1);
      if (Math.abs(b.vx) > 1) b.face = Math.sign(b.vx);
      const goalAlt = Math.max(60, b.y - b.skyGoal);
      b.alt += (goalAlt - b.alt)*Math.min(1, dt*.35) + Math.sin(T*.8 + b.ph)*6*dt;
      b.noteT -= dt;
      if (b.noteT <= 0 && b.rider){
        b.noteT = rand(4, 8);
        const g = hotGeom(b);
        fx.push({k: 'txt', ch: Math.random() < .5 ? '♪' : '✨', col: '#F6C343', x: b.x + b.face*g.bw*.6, y: g.top - g.bh*1.5, vx: b.face*rand(6, 16), vy: -rand(20, 30), life: 2, t0: 2, size: clamp(g.bh*.8, 12, 26)});
      }
      // mostly looks around with its own eyes; only sometimes takes out the telescope
      b.scopeT = (b.scopeT ?? rand(6, 12)) - dt;
      if (b.scopeT <= 0){ b.scope = !b.scope; b.scopeT = b.scope ? rand(4, 7) : rand(12, 22); if (b.scope) b.look = b.face; }
      b.lookT = (b.lookT ?? rand(2, 4)) - dt;
      if (!b.scope && b.lookT <= 0){ b.lookT = rand(2, 5); b.look = Math.random() < .6 ? b.face : -b.face; }
      b.flyT -= dt*(wx.wind > .7 ? 2.5 : 1);
      if (b.flyT <= 0 || !b.rider){ b.hs = 'down'; }
      return;
    }
    if (b.hs === 'down'){
      b.burn = 0;
      b.alt -= Math.max(28*k, Math.min(90*k, b.alt*.35))*dt*M;
      if (b.alt <= 0){
        b.alt = 0; b.hs = 'ground'; b.cool = 5; b.scope = false; b.scopeT = undefined;
        const p = b.rider; b.rider = null;
        if (p){
          p.ride = null; p.jh = hotGeom(b).bh*.9; p.cool = 12;
          const side = Math.random() < .5 ? -1 : 1;
          startFall(p, b.x + side*Ug(b)*rand(.7, 1.1), b.y + rand(0, 30));
        }
        saveSoon();
      }
    }
  }

  /* ================= camera controls ================= */
  const pan = {vx: 0, vy: 0, keys: new Set()};
  const DIRS = {L: [-1, 0], R: [1, 0], U: [0, -1], D: [0, 1]};
  function stepCam(dt){
    let vx = 0, vy = 0;
    for (const k of pan.keys){ const d = DIRS[k]; vx += d[0]*700/ZM; vy += d[1]*700/ZM; }
    // a little glide after letting go of a drag
    if (!panDrag && (Math.abs(pan.vx) > 5 || Math.abs(pan.vy) > 5)){ vx += pan.vx; vy += pan.vy; const f = Math.exp(-5*dt); pan.vx *= f; pan.vy *= f; }
    if (vx || vy){ camX += vx*dt; camY += vy*dt; clampCam(); }
  }
  const KEYMAP = {ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D', a: 'L', d: 'R', w: 'U', s: 'D'};
  addEventListener('keydown', e => { const k = KEYMAP[e.key]; if (k && $('prep').hidden && e.target.tagName !== 'INPUT'){ pan.keys.add(k); e.preventDefault(); } });
  addEventListener('keyup', e => { const k = KEYMAP[e.key]; if (k) pan.keys.delete(k); });
  addEventListener('blur', () => pan.keys.clear());
  // mouse wheel / trackpad pinch = zoom; sideways trackpad scroll = pan
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    const dy = e.deltaMode === 1 ? e.deltaY*30 : e.deltaY;
    if (Math.abs(e.deltaX) > Math.abs(dy) && !e.ctrlKey){ camX += e.deltaX/ZM; clampCam(); return; }
    setZoom(ZM*Math.exp(-dy*(e.ctrlKey ? .01 : .0015)), e.clientX, e.clientY);
  }, {passive: false});
  addEventListener('keydown', e => { if (e.target.tagName === 'INPUT' || !$('prep').hidden) return; if (e.key === '+' || e.key === '='){ setZoom(ZM*1.2, W/2, H/2); } if (e.key === '-'){ setZoom(ZM/1.2, W/2, H/2); } });

  /* ================= update + render ================= */
  function update(dt){
    const k = Math.max(.6, Math.min(W, H)/700);
    T += dt;
    stepCam(dt);
    updateWorld(dt);
    for (const b of items) if (b.type === 'hotair') stepHot(b, dt, k);
    for (const q of items) if (q.type === 'sand' && q.by && (!items.includes(q.by) || q.by.sand !== q)) q.by = null;
    for (const h of items) if (h.type === 'house'){
      if (h.bedBy && (!items.includes(h.bedBy) || h.bedBy.home !== h || !h.bedBy.in || h.bedBy.in.mode !== 'bed')) h.bedBy = null;
      if (h.sofaBy && (!items.includes(h.sofaBy) || h.sofaBy.home !== h || !h.sofaBy.in || h.sofaBy.in.mode !== 'sofa')) h.sofaBy = null;
      const tgt = h.hover || items.some(c => c.home === h) ? .08 : 1;
      h.fa += (tgt - h.fa)*Math.min(1, dt*6);
    }
    for (const p of items) if (p.type === 'char' && p.lb && p.lb.ready) stepChar(p, dt, k);
    for (let i = fx.length - 1; i >= 0; i--){
      const f = fx[i]; f.life -= dt;
      if (f.k === 'drop'){ f.vy += 900*dt; f.x += f.vx*dt; f.y += f.vy*dt; }
      else if (f.k === 'conf'){ f.vy += 500*dt; f.x += f.vx*dt; f.y += f.vy*dt; f.rot += f.vr*dt; }
      else if (f.k === 'txt'){ f.x += (f.vx + Math.sin(f.life*3)*14)*dt; f.y += f.vy*dt; }
      else if (f.k === 'leaf'){ f.x += f.vx*dt; f.y += (f.vy + Math.sin(f.life*5)*40)*dt; f.rot += f.vr*dt; }
      if (f.life <= 0) fx.splice(i, 1);
    }
    for (let i = hearts.length - 1; i >= 0; i--){
      const h = hearts[i]; h.life -= dt; h.x += h.vx*dt; h.y += h.vy*dt;
      if (h.life <= 0) hearts.splice(i, 1);
    }
  }

  function drawChar(p){
    if (p.sandMode === 'swing'){ drawSwing(p); return; }
    if (p.sandMode === 'castle'){ drawCastle(p); return; }
    const {w, h, s, U} = dims(p);
    let bob = 0, tilt = 0, sx = 1, sy = 1;
    const ph = Math.sin(p.t);
    switch (p.state){
      case 'walk': bob = Math.abs(ph)*9*s*M; tilt = ph*.06; sy = 1 - Math.abs(ph)*.03; break;
      case 'run': bob = Math.abs(ph)*20*s*M; tilt = .12 + ph*.05; sx = 1.04; sy = .98; break;
      case 'crawl': tilt = ph*.1; sx = 1.14; sy = .78; break;
      case 'climb': if (p.phase === 'up'){ tilt = ph*.2; sx = 1 + ph*.05; sy = .96; } else { sy = 1 + .02*ph; } break;
      case 'lift': tilt = ph*.08; sx = .96; sy = 1.04; break;
      case 'fall': sx = .94; sy = 1.09; break;
      case 'sleep': { const br = Math.sin(p.t*1.2); sy = 1 + .045*br; sx = 1 - .012*br; if (p.stir > 0) tilt = Math.sin(p.stir*28)*.05*p.stir; break; }
      case 'sit': sy = 1 + .015*Math.sin(p.t*1.6); tilt = p.wv*.035*Math.sin(p.wph*.5); break;
      default: sy = 1 + .02*ph; sx = 1 - .01*ph;
    }
    sx *= 1 + p.squash*.8; sy *= 1 - p.squash;

    const sm = p.sandMode, onMound = sm === 'jump' || sm === 'stomp';
    const lift = bob + p.jh + (onMound ? (p.mound || 0)*h*.45 : 0);
    const shw = w*(p.sleeper ? .4 : .55)*(1 - Math.min(lift, 120)/200);
    if (onMound) drawMound(p, w, h);
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    ctx.beginPath(); ctx.ellipse(p.x, p.y, Math.max(4, shw), Math.max(2, shw*.24), 0, 0, 7); ctx.fill();

    const wadeY = p.inPond && p.jh === 0 ? 4*s : 0;
    p._bt = [p.x, p.y - lift + wadeY, tilt*p.face, p.face*(p.flip ? -1 : 1)*sx, sy];   // body transform (the umbrella needs it)
    if ((p.umb || 0) > .02) drawUmbrella(p, w, h, lift, 'back');
    const buried = sm === 'dig' || sm === 'buried';
    ctx.save();
    if (buried){ ctx.beginPath(); ctx.rect(p.x - w*2, p.y - h*3, w*4, h*3 - h*.46*(p.mound || 0)); ctx.clip(); }   // body under the sand
    ctx.translate(p._bt[0], p._bt[1]); ctx.rotate(p._bt[2]); ctx.scale(p._bt[3], p._bt[4]);
    drawBody(p, w, h);
    ctx.restore();
    if (buried) drawMound(p, w, h);
    drawCharExtras(p, w, h, s, lift);
  }
  function drawBody(p, w, h){
    const lb = p.lb;
    if (lb.ch){
      // sitting picture, or the arms-up picture whose two arms wave from the shoulders
      const up = p.wv || 0, f0 = w/lb.sw, c = lb.cheer;
      if (up < 1){ ctx.globalAlpha = 1 - up; ctx.drawImage(lb.im, -w/2, -h, w, h); }
      if (up > 0){
        ctx.globalAlpha = up;
        ctx.drawImage(lb.ch.up, -w/2, -h, w, h);
        const arm = (im, pv, a) => {
          ctx.save(); ctx.translate(-w/2 + pv[0]*f0, -h + pv[1]*f0); ctx.rotate(a);
          ctx.drawImage(im, -pv[0]*f0, -pv[1]*f0, w, h); ctx.restore();
        };
        const ph = p.wph || 0;
        arm(lb.ch.L, c.pivL, Math.sin(ph)*.2 - .04);
        arm(lb.ch.R, c.pivR, Math.sin(ph + .9)*.1);
      }
      ctx.globalAlpha = 1;
    } else ctx.drawImage(lb.im, -w/2, -h, w, h);
  }
  function drawCharExtras(p, w, h, s, lift){
    if ((p.umb || 0) > .02) drawUmbrella(p, w, h, lift, 'front');

    if (p.inPond && p.jh === 0){
      ctx.fillStyle = NAT.water; ctx.globalAlpha = .55;
      ctx.beginPath(); ctx.ellipse(p.x, p.y + 1, w*.42, w*.42*.26, 0, 0, 7); ctx.fill();
      ctx.globalAlpha = 1; ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1.5;
      for (let i = 0; i < 2; i++){
        const f = (T*1.2 + i*.5) % 1;
        ctx.globalAlpha = 1 - f;
        ctx.beginPath(); ctx.ellipse(p.x, p.y + 1, w*.3 + f*w*.35, (w*.3 + f*w*.35)*.26, 0, 0, 7); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    if (p.carry){
      const bU = baseU()*p.carry.size*depth(p.y), bw = bU*.3, bh = bU*.4;
      const bx = p.x + Math.sin(p.t*1.2)*bU*.06, by = p.y - lift - h - bU*.35 - bh;
      ctx.strokeStyle = '#52645A'; ctx.lineWidth = Math.max(1, bU*.012);
      ctx.beginPath(); ctx.moveTo(p.x, p.y - lift - h*.85); ctx.lineTo(bx, by + bh + bw*.22); ctx.stroke();
      drawBalloonShape(bx, by, bw, bh, p.carry.col);
    }
  }

  function drawUmbrella(p, w, h, lift, part){
    const u = p.umb, dir = p.face*(p.flip ? -1 : 1), R = w*.66*u + 1, ry = R*.6;
    let hx = p.x + dir*w*.3, hy = p.y - lift - h*.42;                 // where the paw holds the handle
    const paw = p.lb.paw, bt = p._bt;
    if (paw && bt){
      const lx = (paw[0] - .5)*w*bt[3], ly = -(1 - paw[1])*h*bt[4], c = Math.cos(bt[2]), sn = Math.sin(bt[2]);
      hx = bt[0] + lx*c - ly*sn; hy = bt[1] + lx*sn + ly*c;
    }
    // straight umbrella: canopy right above the paw
    const cx = hx, cy = p.y - lift - h*1.08 - R*.1;
    const tilt = -wx.wind*.2*Math.sign(dir || 1) + Math.sin(T*3 + p.ph)*.02;
    ctx.save();
    ctx.strokeStyle = '#5A3B22'; ctx.lineWidth = Math.max(1.5, w*.03); ctx.lineCap = 'round';
    if (part === 'back'){ ctx.restore(); return; }
    const hk = hy + h*.12;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(hx, hk); ctx.stroke();      // one straight handle, in front, through the paw
    ctx.beginPath(); ctx.arc(hx - dir*w*.04, hk, w*.04, 0, Math.PI, false); ctx.stroke();   // J handle below the paw
    if (paw && bt){
      // draw the paw again on top so the handle passes through the closed paw
      ctx.save(); ctx.translate(bt[0], bt[1]); ctx.rotate(bt[2]); ctx.scale(bt[3], bt[4]);
      ctx.beginPath(); ctx.ellipse((paw[0] - .5)*w, -(1 - paw[1])*h, paw[2]*w*1.2, paw[2]*w, 0, 0, 7); ctx.clip();
      drawBody(p, w, h); ctx.restore();
    }
    ctx.translate(cx, cy); ctx.rotate(tilt);
    // canopy with scalloped edge and two-colour panels
    const n = 6, edge = [];
    for (let i = 0; i <= n; i++) edge.push(-R + 2*R*i/n);
    ctx.beginPath(); ctx.moveTo(-R, 0); ctx.ellipse(0, 0, R, ry, 0, Math.PI, 0);
    for (let i = n; i > 0; i--){ const a = edge[i], b = edge[i - 1]; ctx.quadraticCurveTo((a + b)/2, -ry*.16, b, 0); }
    ctx.closePath(); ctx.fillStyle = '#F0566B'; ctx.fill();
    ctx.save(); ctx.clip();
    ctx.fillStyle = '#FFFFFF';
    for (let i = 0; i < n; i += 2){ ctx.beginPath(); ctx.moveTo(0, -ry); ctx.lineTo(edge[i], 0); ctx.lineTo(edge[i + 1], 0); ctx.closePath(); ctx.fill(); }
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.beginPath(); ctx.ellipse(-R*.35, -ry*.55, R*.25, ry*.2, -.4, 0, 7); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = '#5A3B22'; ctx.lineWidth = Math.max(1, w*.02); ctx.beginPath(); ctx.moveTo(0, -ry); ctx.lineTo(0, -ry - R*.12); ctx.stroke();
    ctx.restore();
  }
  function drawDeco(p){
    const {w, h} = dims(p);
    ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(p.x, p.y, w*.5, w*.5*.22, 0, 0, 7); ctx.fill();
    ctx.save(); ctx.translate(p.x, p.y); ctx.scale(p.flip ? -1 : 1, 1);
    ctx.drawImage(p.lb.im, -w/2, -h, w, h); ctx.restore();
  }

  function selRing(g, it){
    let rx;
    if (it.type === 'pond') rx = pondRx(it)*1.15;
    else if (it.type === 'sand') rx = sandR(it)*1.08;
    else if (it.type === 'tree') rx = Ug(it)*.6;
    else if (it.type === 'balloon') rx = Ug(it)*.35;
    else if (it.type === 'hotair') rx = Ug(it)*.45*HOT_K/1.15;
    else if (it.type === 'house') rx = Ug(it)*1.4*HOUSE_K;
    else rx = dims(it).w*.62;
    const ry = it.type === 'pond' || it.type === 'sand' ? rx*.3 : rx*.26;
    g.strokeStyle = UI.accent; g.lineWidth = 2; g.setLineDash([5, 4]);
    g.beginPath(); g.ellipse(it.x, it.y, rx, ry, 0, 0, 7); g.stroke(); g.setLineDash([]);
  }

  function render(){
    // 1. sky (not tinted, it has its own colours)
    mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawSky();

    // 2. everything on the ground goes into a layer that gets the time-of-day / weather tint
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, layer.width, layer.height);
    ctx.setTransform(dpr*ZM, 0, 0, dpr*ZM, -camX*dpr*ZM, -camY*dpr*ZM);
    const sx = Math.max(0, camX), sy = Math.max(landY0, camY), ex = Math.min(WW, camX + W/ZM), ey = Math.min(WH, camY + H/ZM);
    if (ex > sx && ey > sy) ctx.drawImage(land, sx*landS, (sy - landY0)*landS, (ex - sx)*landS, (ey - sy)*landS, sx, sy, ex - sx, ey - sy);

    for (const it of items) if (it.type === 'pond') drawPond(it);
    for (const it of items) if (it.type === 'sand') drawSand(it);
    const flying = [];
    for (const it of items) if (it.type === 'hotair' && it.alt >= 2){ hotShadow(it); flying.push(it); }
    const rest = items.filter(i => i.type !== 'pond' && i.type !== 'sand' && !(i.type === 'hotair' && i.alt >= 2) && !(i.type === 'char' && (i.state === 'ride' || i.state === 'inside')) &&
      ((i.type !== 'char' && i.type !== 'deco') || (i.lb && i.lb.ready)));
    rest.sort((a, b) => a.y - b.y);
    for (const it of rest){
      if (it.type === 'char') drawChar(it);
      else if (it.type === 'deco') drawDeco(it);
      else if (it.type === 'tree') drawTree(it);
      else if (it.type === 'balloon') drawBalloon(it);
      else if (it.type === 'hotair') drawHotAir(it);
      else if (it.type === 'house') drawHouse(it);
    }
    flying.sort((a, b) => a.y - b.y);
    for (const it of flying) drawHotAir(it);

    for (const f of fx){
      if (f.k === 'drop'){ ctx.globalAlpha = clamp(f.life/.3, 0, 1); ctx.fillStyle = f.c; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 7); ctx.fill(); }
      else if (f.k === 'ring'){
        const q = 1 - f.life/f.t0; ctx.globalAlpha = (1 - q)*(f.thin ? .6 : 1); ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = f.thin ? 1 : 2;
        ctx.beginPath(); ctx.ellipse(f.x, f.y, f.max*q + 2, (f.max*q + 2)*.3, 0, 0, 7); ctx.stroke();
      } else if (f.k === 'conf' || f.k === 'leaf'){
        ctx.globalAlpha = clamp(f.life/.3, 0, 1); ctx.fillStyle = f.c; ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot);
        if (f.k === 'conf') ctx.fillRect(-f.r, -f.r*.5, f.r*2, f.r);
        else { ctx.beginPath(); ctx.ellipse(0, 0, f.r, f.r*.45, 0, 0, 7); ctx.fill(); }
        ctx.restore();
      }
    }
    ctx.globalAlpha = 1;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-atop';
    const t = sky.tint;
    if (t[3] > .005){ ctx.fillStyle = rgb(t, t[3]); ctx.fillRect(0, 0, layer.width, layer.height); }
    if (wx.dark > .005){ ctx.fillStyle = `rgba(38,46,58,${wx.dark})`; ctx.fillRect(0, 0, layer.width, layer.height); }
    const hotA = .08*wx.hot*(1 - sky.night);
    if (hotA > .004){ ctx.fillStyle = `rgba(255,190,90,${hotA})`; ctx.fillRect(0, 0, layer.width, layer.height); }
    ctx.globalCompositeOperation = 'source-over';
    mctx.drawImage(layer, 0, 0, W, H);

    // 3. glowing / UI-ish things drawn on top, in world space
    mctx.setTransform(dpr*ZM, 0, 0, dpr*ZM, -camX*dpr*ZM, -camY*dpr*ZM);
    if (sel && items.includes(sel) && sel.state !== 'inside') selRing(mctx, sel);
    const fa = clamp((sky.night - .4)/.6, 0, 1)*(1 - wx.rain);
    if (fa > .01) for (const f of flies){
      if (f.fresh) continue;
      const a = fa*(.5 + .5*Math.sin(f.ph));
      mctx.fillStyle = `rgba(210,255,120,${.22*a})`; mctx.beginPath(); mctx.arc(f.x, f.y, 7, 0, 7); mctx.fill();
      mctx.fillStyle = `rgba(240,255,170,${a})`; mctx.beginPath(); mctx.arc(f.x, f.y, 2.2, 0, 7); mctx.fill();
    }
    for (const f of fx){
      if (f.k !== 'txt') continue;
      const q = 1 - f.life/f.t0;
      mctx.globalAlpha = clamp(Math.min(q*4, f.life/.8), 0, 1);
      mctx.font = '700 ' + Math.round(f.size*(.6 + q*.7)) + 'px ' + UI.font;
      mctx.textAlign = 'center'; mctx.lineWidth = 3; mctx.strokeStyle = 'rgba(255,255,255,.85)'; mctx.fillStyle = f.col;
      mctx.strokeText(f.ch, f.x, f.y); mctx.fillText(f.ch, f.x, f.y);
    }
    mctx.globalAlpha = 1;
    mctx.textAlign = 'center'; mctx.fillStyle = UI.heart;
    for (const h of hearts){
      mctx.globalAlpha = clamp(h.life/.6, 0, 1);
      mctx.font = h.size + 'px sans-serif';
      mctx.fillText('♥', h.x, h.y);
    }
    mctx.globalAlpha = 1;

    // 4. rain + lightning, in screen space
    mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const nRain = Math.round(wx.rain*drops.length);
    if (nRain){
      const windX = wx.wind*420;
      mctx.strokeStyle = sky.night > .5 ? 'rgba(170,185,210,.45)' : 'rgba(215,228,245,.55)'; mctx.lineWidth = 1.2; mctx.beginPath();
      for (let i = 0; i < nRain; i++){ const d = drops[i]; if (d.fresh) continue; mctx.moveTo(d.x, d.y); mctx.lineTo(d.x - d.l*windX/d.v, d.y - d.l); }
      mctx.stroke();
    }
    if (flash > .02){ mctx.fillStyle = `rgba(235,240,255,${flash*.55})`; mctx.fillRect(0, 0, W, H); }
  }

  let last = performance.now();
  function frame(now){
    const dt = Math.min(.05, (now - last)/1000); last = now;
    update(dt); render(); requestAnimationFrame(frame);
  }

  /* ================= hit testing + pointer ================= */
  function hitOf(it, x, y){
    if (it.type === 'char' && it.state === 'inside'){
      if (!it.home || it.home.fa > .6 || !it._box) return false;
      const b = it._box; return x > b[0] && x < b[2] && y > b[1] && y < b[3];
    }
    if (it.type === 'house'){ const g = houseGeom(it); return x > g.L - g.U*.1 && x < g.R + g.U*.1 && y > g.apex && y < g.G + g.U*.04; }
    if (it.type === 'char' && it.sandMode && (it.sandMode === 'swing' || it.sandMode === 'castle') && it._box){
      const b = it._box; return x > b[0] && x < b[2] && y > b[1] && y < b[3];
    }
    if (it.type === 'sand'){ const rx = sandR(it); return ((x - it.x)/rx)**2 + ((y - it.y)/(rx*.32))**2 < 1; }
    if (it.type === 'char' || it.type === 'deco'){
      if (!it.lb || !it.lb.ready || it.state === 'ride') return false;
      const {w, h} = dims(it), lift = it.type === 'char' ? it.jh : 0;
      return x > it.x - w/2 && x < it.x + w/2 && y > it.y - lift - h && y < it.y - lift;
    }
    if (it.type === 'tree'){
      const R = treeR(it), top = it.y - treeH(it)*.72 - R*1.1;
      return x > it.x - R*1.2 && x < it.x + R*1.2 && y > top && y < it.y;
    }
    if (it.type === 'balloon'){
      const g = balloonGeom(it, T);
      return x > g.bx - g.bw*1.3 && x < g.bx + g.bw*1.3 && y > g.by - g.bh && y < it.y;
    }
    if (it.type === 'hotair'){
      const g = hotGeom(it);
      return x > it.x - g.R*1.1 && x < it.x + g.R*1.1 && y > g.ey - g.R*1.1 && y < g.by + 4;
    }
    const rx = pondRx(it)*1.08;
    return ((x - it.x)/rx)**2 + ((y - it.y)/(rx*.3))**2 < 1;
  }
  function hit(x, y){
    let best = null, bk = -1e9;
    for (const it of items){
      if (!hitOf(it, x, y)) continue;
      const key = it.type === 'pond' || it.type === 'sand' ? -1e6 + it.y : it.type === 'hotair' && it.alt > 2 ? 1e6 : it.state === 'inside' && it.home ? it.home.y + .8 : it.y + (it.type === 'char' ? .5 : 0);
      if (key > bk){ bk = key; best = it; }
    }
    return best;
  }

  function heartsAt(p){
    let hx = p.x, hy;
    if (p.sandMode && p._box){ hy = p._box[1]; hx = (p._box[0] + p._box[2])/2; }
    else if (p.state === 'ride' && p.ride){ const g = hotGeom(p.ride); hy = g.top - g.bh*1.4; hx = p.ride.x; }
    else if (p.state === 'inside' && p.home){ const g = houseGeom(p.home); hy = p.in.mode === 'bed' ? p.y - g.U*.3 : p.in.mode === 'sofa' ? p.y - inDims(p, g).h*.8 : p.y - p.jh*.5 - inDims(p, g).h*.9; }
    else hy = p.y - p.jh - dims(p).h*.9;
    for (let i = 0; i < 4; i++)
      hearts.push({x: hx + rand(-18, 18), y: hy, vx: rand(-20, 20), vy: rand(-70, -40), life: 1.1, size: rand(16, 26)});
  }
  function petIt(p){
    if (p.state === 'inside' && p.in && (p.in.mode === 'bed' || p.in.mode === 'sofa')){ p.stir = 1; if (p.sitter){ p.ear = 1; p.earWhich = 2; } heartsAt(p); return; }
    if (p.state === 'inside' && !p.sleeper && !p.sitter){ if (p.jh === 0) p.jv = 300*Math.max(.6, Math.min(W, H)/700)*M; heartsAt(p); return; }
    if (p.sleeper){ p.stir = 1; heartsAt(p); return; }
    if (p.sitter){ if (!p.waveOn && p.jh === 0){ p.jv = 330*Math.max(.6, Math.min(W, H)/700)*M; p.squash = .14; } p.waveOn = true; p.waveT = 3.5; p.fast = 2.5; heartsAt(p); return; }
    const k = Math.max(.6, Math.min(W, H)/700);
    p.state = 'idle'; p.timer = 1.2; p.jv = 480*k*M;
    heartsAt(p);
  }

  function select(it){ sel = it; if (it) closeTray(true); refreshUI(); }
  const wpos = e => [e.clientX/ZM + camX, e.clientY/ZM + camY];

  const touches = new Map();
  let pinch = null, pinchDone = false;
  const tdist = () => { const [a, b] = [...touches.values()]; return Math.max(10, Math.hypot(a.x - b.x, a.y - b.y)); };
  const tmid = () => { const [a, b] = [...touches.values()]; return [(a.x + b.x)/2, (a.y + b.y)/2]; };
  cv.addEventListener('pointerdown', e => {
    touches.set(e.pointerId, {x: e.clientX, y: e.clientY});
    if (touches.size === 2){
      // second finger: stop whatever the first finger was doing and start zooming
      if (drag){ const it = drag.it; if (it.type === 'char' && it.state === 'held'){ it.state = 'idle'; it.timer = rand(.6, 1.2); } drag = null; }
      panDrag = null; pan.vx = pan.vy = 0;
      if (sel) select(null);
      for (const q of items) if (q.type === 'house') q.hover = false;
      const [mx, my] = tmid();
      pinch = {d0: tdist(), z0: ZM, wx: mx/ZM + camX, wy: my/ZM + camY}; pinchDone = true;
      cv.setPointerCapture(e.pointerId);
      return;
    }
    if (touches.size > 2 || pinch) return;
    pinchDone = false;
    const [x, y] = wpos(e);
    if (armed){ place(x, y); return; }
    const it = hit(x, y);
    if (it){
      select(it);
      if (it.type === 'hotair' && it.hs !== 'ground'){ if (it.rider) heartsAt(it.rider); return; }
      if (it.type === 'char' && it.state === 'inside'){ drag = {it, sx: e.clientX, sy: e.clientY, ox: 0, oy: 0, moved: false, fromHouse: true}; cv.setPointerCapture(e.pointerId); return; }
      if (it.type === 'char' && busy(it)){ heartsAt(it); return; }
      drag = {it, sx: e.clientX, sy: e.clientY, ox: x - it.x, oy: y - it.y, moved: false};
      if (it.type === 'char') it.state = 'held';
      cv.setPointerCapture(e.pointerId);
    } else {
      panDrag = {sx: e.clientX, sy: e.clientY, cx: camX, cy: camY, moved: false, lx: e.clientX, ly: e.clientY, lt: performance.now()};
      pan.vx = pan.vy = 0;
      cv.setPointerCapture(e.pointerId);
    }
  });
  cv.addEventListener('pointermove', e => {
    if (touches.has(e.pointerId)) touches.set(e.pointerId, {x: e.clientX, y: e.clientY});
    if (pinch){
      if (touches.size < 2) return;
      const [mx, my] = tmid();
      ZM = clamp(pinch.z0*tdist()/pinch.d0, zMin(), Z_MAX);
      camX = pinch.wx - mx/ZM; camY = pinch.wy - my/ZM; clampCam();
      return;
    }
    if (drag){
      if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 6) drag.moved = true;
      if (drag.moved){
        const [x, y] = wpos(e), [x0, x1] = gx(), [y0, y1] = gy(), it = drag.it;
        if (it.type === 'char' && it.sandMode) leaveSand(it);      // dragged out of the sand
        if (drag.fromHouse && it.state === 'inside'){
          // lift it out of the house
          const h = it.home; if (h && h.bedBy === it) h.bedBy = null; if (h && h.sofaBy === it) h.sofaBy = null;
          it.home = null; it.in = null; it.state = 'held'; it.jh = 26;
          drag.ox = 0; drag.oy = 0;
        }
        it.x = clamp(x - drag.ox, x0, x1); it.y = clamp(y - drag.oy, y0, y1);
        it.tx = it.x; it.ty = it.y;
        if (it.type === 'char'){ const hh = houseAt(x, y); for (const q of items) if (q.type === 'house') q.hover = q === hh; }
      }
    } else if (panDrag){
      const dx = e.clientX - panDrag.sx, dy = e.clientY - panDrag.sy;
      if (!panDrag.moved && Math.hypot(dx, dy) > 8) panDrag.moved = true;
      if (panDrag.moved){
        camX = panDrag.cx - dx/ZM; camY = panDrag.cy - dy/ZM; clampCam(); cv.style.cursor = 'grabbing';
        const now = performance.now(), ddt = Math.max(1, now - panDrag.lt)/1000;
        pan.vx = lerp(pan.vx, -(e.clientX - panDrag.lx)/ddt/ZM, .5); pan.vy = lerp(pan.vy, -(e.clientY - panDrag.ly)/ddt/ZM, .5);
        panDrag.lx = e.clientX; panDrag.ly = e.clientY; panDrag.lt = now;
      }
    } else if (armed){
      const [x, y] = wpos(e), hh = armed.type === 'char' ? houseAt(x, y) : null;
      for (const q of items) if (q.type === 'house') q.hover = q === hh;
    } else { const [x, y] = wpos(e); cv.style.cursor = hit(x, y) ? 'grab' : 'default'; }
  });
  const release = e => {
    touches.delete(e.pointerId);
    if (pinch){ if (touches.size < 2) pinch = null; return; }
    if (pinchDone){ if (touches.size === 0) pinchDone = false; return; }   // lifting the fingers after a pinch is not a tap
    if (panDrag){
      const pd = panDrag; panDrag = null; cv.style.cursor = 'default';
      if (!pd.moved || performance.now() - pd.lt > 80){ pan.vx = pan.vy = 0; }
      if (!pd.moved && e.type === 'pointerup'){
        if (sel) select(null);
        const [x, y] = wpos(e);
        let q = null, best = 1e12;
        for (const c of items){ if (c.type !== 'char' || c.sleeper || c.sitter || !c.lb || !c.lb.ready || c.state === 'held' || busy(c)) continue; const d = Math.hypot(c.x - x, c.y - y); if (d < best){ best = d; q = c; } }
        if (q){
          const [x0, x1] = gx(), [y0, y1] = gy();
          q.tx = clamp(x, x0, x1); q.ty = clamp(y, y0, y1);
          q.state = 'run'; q.face = q.tx >= q.x ? 1 : -1;
        }
      }
      return;
    }
    if (!drag) return;
    const {it, moved} = drag; drag = null;
    for (const q of items) if (q.type === 'house') q.hover = false;
    if (it.type === 'char' && it.state === 'inside'){ if (!moved) petIt(it); return; }
    if (it.type === 'char' && moved && e.type === 'pointerup'){
      const [x, y] = wpos(e), hh = houseAt(x, y);
      if (hh){ putInHouse(it, hh, x, y); saveAll(); return; }
    }
    if (it.type === 'char'){
      it.state = 'idle'; it.timer = rand(.6, 1.2);
      if (!moved && it.sandMode){ heartsAt(it); return; }          // just a pat, keep playing
      if (moved && trySand(it)){ saveSoon(); return; }
      if (!moved) petIt(it);
    }
    if (moved) saveSoon();
  };
  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', release);

  /* ================= placing ================= */
  function arm(a){
    armed = a; closeTray(true); select(null);
    $('bannerText').textContent = '點一下草地,放下' + a.label;
    $('banner').hidden = false; cv.style.cursor = 'crosshair';
  }
  function disarm(){ armed = null; $('banner').hidden = true; cv.style.cursor = 'default'; }
  $('bannerCancel').onclick = disarm;

  function placeAt(a, x, y){
    for (const q of items) if (q.type === 'house') q.hover = false;
    if (items.length >= MAX_ITEMS){ toast('草地上東西太多了,先收起來一些。'); return; }
    const [x0, x1] = gx(), [y0, y1] = gy();
    const hh = a.type === 'char' ? houseAt(x, y) : null;
    const it = newItem({type: a.type, ref: a.ref, x: clamp(x, x0, x1), y: clamp(y, y0, y1), drop: a.type === 'char' && !hh});
    items.push(it);
    if (hh) putInHouse(it, hh, x, y);
    else if (a.type === 'char') trySand(it);
    saveAll(); refreshUI();
  }
  function place(x, y){ const a = armed; disarm(); placeAt(a, x, y); }

  // press a card in the tray and drag it up onto the meadow (or into a house)
  let cardDrag = null, noClickUntil = 0;
  const ghost = document.createElement('div'); ghost.className = 'ghostdrag'; ghost.hidden = true; document.body.append(ghost);
  addEventListener('pointermove', e => {
    const c = cardDrag; if (!c) return;
    const dx = e.clientX - c.sx, dy = e.clientY - c.sy;
    if (!c.moved){
      if (dy < -12 && Math.abs(dy) > Math.abs(dx)){ c.moved = true; ghost.innerHTML = c.html; ghost.hidden = false; $('tray').style.opacity = '0'; $('tray').style.pointerEvents = 'none'; }
      else return;
    }
    ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px';
    const hh = c.spec.type === 'char' ? houseAt(e.clientX/ZM + camX, e.clientY/ZM + camY) : null;
    for (const q of items) if (q.type === 'house') q.hover = q === hh;
  });
  const endCard = e => {
    const c = cardDrag; if (!c) return; cardDrag = null;
    if (!c.moved) return;
    const onMeadow = e.type === 'pointerup' && document.elementFromPoint(e.clientX, e.clientY) === cv;   // check before the tray comes back
    ghost.hidden = true; $('tray').style.opacity = ''; $('tray').style.pointerEvents = ''; noClickUntil = performance.now() + 400;
    for (const q of items) if (q.type === 'house') q.hover = false;
    if (onMeadow){ placeAt(c.spec, e.clientX/ZM + camX, e.clientY/ZM + camY); closeTray(); }
  };
  addEventListener('pointerup', endCard); addEventListener('pointercancel', endCard);

  /* ================= dock, trays, selection bar ================= */
  const ICONS = {
    balloon: '<svg viewBox="0 0 48 48"><ellipse cx="24" cy="18" rx="11" ry="14" fill="#F0566B"/><path d="M24 31l-3 4h6z" fill="#F0566B"/><path d="M24 35q-5 5 0 11" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round"/><ellipse cx="19.5" cy="12" rx="2.4" ry="4" fill="#fff" opacity=".5"/></svg>',
    tree: '<svg viewBox="0 0 48 48"><path d="M21 44l1.5-16h3L27 44z" fill="#7B5B3A"/><circle cx="24" cy="20" r="10" fill="#2F8047"/><circle cx="16" cy="24" r="7" fill="#2F8047"/><circle cx="32" cy="24" r="7" fill="#2F8047"/><circle cx="23" cy="18" r="8" fill="#4DAE62"/><circle cx="17" cy="23" r="5.5" fill="#4DAE62"/><circle cx="31" cy="23" r="5.5" fill="#4DAE62"/></svg>',
    pond: '<svg viewBox="0 0 48 48"><ellipse cx="24" cy="28" rx="21" ry="11" fill="#B5E5F6"/><ellipse cx="24" cy="28" rx="18" ry="8.5" fill="#3E97C9"/><ellipse cx="24" cy="27" rx="18" ry="7" fill="#5FB8E0"/><ellipse cx="18" cy="25" rx="5" ry="1.8" fill="#fff" opacity=".4"/></svg>',
    sand: '<svg viewBox="0 0 48 48"><ellipse cx="24" cy="30" rx="21" ry="10" fill="#E4D5B4"/><ellipse cx="24" cy="29" rx="19" ry="8.5" fill="#F6EEDC"/><path d="M15 28q3-5 6 0z" fill="#EAD7A8"/><circle cx="31" cy="27" r="1" fill="#D9C39A"/><circle cx="27" cy="32" r="1" fill="#D9C39A"/><circle cx="18" cy="32" r="1" fill="#D9C39A"/></svg>',
    house: '<svg viewBox="0 0 48 48"><path d="M6 22L24 7l18 15z" fill="#C8553D"/><rect x="10" y="21" width="28" height="23" fill="#F3DFB8"/><rect x="21" y="30" width="7" height="14" fill="#B5673F"/><rect x="13" y="25" width="6" height="6" fill="#BFE2F2" stroke="#fff"/><rect x="30" y="25" width="6" height="6" fill="#BFE2F2" stroke="#fff"/><rect x="31" y="9" width="4" height="7" fill="#B4533D"/></svg>',
    hotair: '<svg viewBox="0 0 48 48"><path d="M24 2C14 2 8 9 8 17c0 7 6 12 11 17h10c5-5 11-10 11-17 0-8-6-15-16-15z" fill="#E8504A"/><path d="M24 2c-5 0-8 7-8 15 0 7 3 12 5 17h6c2-5 5-10 5-17 0-8-3-15-8-15z" fill="#F6C343"/><path d="M24 2c-1.5 0-2.5 7-2.5 15 0 7 1 12 1.5 17h2c.5-5 1.5-10 1.5-17 0-8-1-15-2.5-15z" fill="#E8504A"/><path d="M19 34l-1 5M29 34l1 5" stroke="#6B5438" stroke-width="1.2"/><path d="M17 38h14l-1.5 8h-11z" fill="#9B6B3E"/></svg>'
  };

  function closeTray(silent){ tray = null; if (!silent) refreshUI(); else { $('tray').hidden = true; $('dProps').classList.remove('on'); $('dChars').classList.remove('on'); } }
  function openTray(name){
    if (tray === name){ closeTray(); return; }
    disarm(); sel = null; tray = name; refreshUI();
  }

  function card(html, label, onClick, onDel, spec){
    const b = document.createElement('button'); b.className = 'card';
    b.innerHTML = '<span class="ico">' + html + '</span><span>' + label + '</span>';
    b.onclick = e => { if (performance.now() < noClickUntil) return; onClick(e); };
    if (spec) b.addEventListener('pointerdown', e => { cardDrag = {spec, html, sx: e.clientX, sy: e.clientY, moved: false}; });
    if (onDel){
      const x = document.createElement('button'); x.className = 'x'; x.textContent = '×'; x.setAttribute('aria-label', '從角色庫刪除');
      x.onclick = e => { e.stopPropagation(); onDel(); };
      b.append(x);
    }
    return b;
  }

  function delLib(e){
    if (!confirm('要從角色庫刪除嗎?草地上同一個角色也會一起消失。')) return;
    lib.splice(lib.indexOf(e), 1);
    for (let i = items.length - 1; i >= 0; i--) if (items[i].ref === e.id) items.splice(i, 1);
    if (sel && !items.includes(sel)) sel = null;
    saveAll(); refreshUI();
  }

  function buildTray(){
    const row = $('trayRow'); row.innerHTML = '';
    if (tray === 'props'){
      $('trayTitle').textContent = '點一下再點草地放下,或直接往上拖到草地';
      for (const t of ['balloon', 'tree', 'pond', 'hotair', 'house', 'sand'])
        row.append(card(ICONS[t], NAMES[t], () => arm({type: t, label: NAMES[t]}), null, {type: t}));
      lib.filter(l => l.kind === 'prop').forEach((l, i) =>
        row.append(card('<img alt="" draggable="false" src="' + l.img + '">', '裝飾' + (i + 1), () => arm({type: 'deco', ref: l.id, label: '這個裝飾'}), () => delLib(l), {type: 'deco', ref: l.id})));
    } else {
      $('trayTitle').textContent = '點一下再點草地放下,或直接往上拖到草地或房子裡';
      lib.filter(l => l.builtin).forEach(l =>
        row.append(card('<img alt="" draggable="false" src="' + l.img + '">', l.name, () => arm({type: 'char', ref: l.id, label: l.name}), null, {type: 'char', ref: l.id})));
      lib.filter(l => l.kind === 'char' && !l.builtin).forEach((l, i) =>
        row.append(card('<img alt="" draggable="false" src="' + l.img + '">', '角色' + (i + 1), () => arm({type: 'char', ref: l.id, label: '這個角色'}), () => delLib(l), {type: 'char', ref: l.id})));
    }
  }

  function refreshUI(){
    $('empty').hidden = items.length > 0;
    $('tray').hidden = !tray;
    $('dProps').classList.toggle('on', tray === 'props');
    $('dChars').classList.toggle('on', tray === 'chars');
    if (tray) buildTray();
    $('selbar').hidden = !sel;
    if (sel) $('sFlip').hidden = !(sel.type === 'char' || sel.type === 'deco');
  }

  $('dProps').onclick = () => openTray('props');
  $('dChars').onclick = () => openTray('chars');
  $('dClear').onclick = () => {
    if (!items.length){ toast('草地上已經是空的了。'); return; }
    if (!confirm('要把草地上所有的角色和道具都移除嗎?')) return;
    items.length = 0; fx.length = 0; hearts.length = 0; sel = null; drag = null;
    disarm(); closeTray(true); saveAll(); refreshUI();
  };

  $('sFlip').onclick = () => { if (sel){ sel.flip = !sel.flip; saveSoon(); } };
  $('sDel').onclick = () => {
    if (!sel) return;
    if (sel.type === 'char' && sel.sandMode) leaveSand(sel);
    if (sel.type === 'sand' && sel.by) leaveSand(sel.by);
    if (sel.type === 'hotair' && sel.rider){ const p = sel.rider; sel.rider = null; p.ride = null; startFall(p); }
    if (sel.type === 'house') for (const c of items.filter(c => c.home === sel)) leaveHouse(c);
    if (sel.state === 'inside' && sel.home && sel.home.bedBy === sel) sel.home.bedBy = null;
    if (sel.state === 'inside' && sel.home && sel.home.sofaBy === sel) sel.home.sofaBy = null;
    items.splice(items.indexOf(sel), 1); sel = null; saveAll(); refreshUI();
  };
  $('sDone').onclick = () => select(null);

  /* ================= prep dialog ================= */
  const prepEl = $('prep'), pcv = $('prepCv'), pctx = pcv.getContext('2d');
  const tolIn = $('tol'), tolOut = $('tolOut'), prepMsg = $('prepMsg');
  const PS = 320, MSG = '先用自動去背處理。還有殘留的地方,按「手動描邊」,把要留下的部分圈起來。';
  let prep = null, pmode = 'preview', ppts = [], pdraw = false, fit = {s: 1, ox: 0, oy: 0};
  const fitFor = (w, h) => { const s = Math.min(PS/w, PS/h); return {s, ox: (PS - w*s)/2, oy: (PS - h*s)/2}; };

  function prepRender(){
    pctx.clearRect(0, 0, PS, PS);
    const c = prep.lassoCut || prep.sprite;
    fit = fitFor(c.width, c.height);
    pctx.drawImage(c, fit.ox, fit.oy, c.width*fit.s, c.height*fit.s);
    if (pmode === 'lasso' && ppts.length > 1){
      pctx.beginPath(); pctx.moveTo(ppts[0].x, ppts[0].y);
      for (const q of ppts) pctx.lineTo(q.x, q.y);
      if (!pdraw) pctx.closePath();
      pctx.lineWidth = 3; pctx.strokeStyle = '#FF3B6B'; pctx.setLineDash([8, 5]); pctx.stroke(); pctx.setLineDash([]);
    }
  }
  function setMode(m){
    pmode = m; ppts = [];
    $('gPreview').hidden = m !== 'preview'; $('gLasso').hidden = m !== 'lasso';
    $('tolRow').hidden = m !== 'preview';
    pcv.classList.toggle('draw', m === 'lasso');
    prepMsg.textContent = m === 'lasso' ? '沿著要留下的部分畫一整圈,圈外的會被去掉。' : MSG;
    prepRender();
  }
  function openPrep(img){
    const s = Math.min(1, 360/Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.naturalWidth*s)); c.height = Math.max(1, Math.round(img.naturalHeight*s));
    const x = c.getContext('2d', {willReadFrequently:true}); x.drawImage(img, 0, 0, c.width, c.height);
    let hasAlpha = false;
    try { const d = x.getImageData(0, 0, c.width, c.height).data; for (let i = 3; i < d.length; i += 28) if (d[i] < 200){ hasAlpha = true; break; } } catch(e){}
    const tol = hasAlpha ? 0 : 22;
    prep = {raw: c, tol, sprite: makeSprite(c, tol), lassoCut: null};
    tolIn.value = tol; tolOut.textContent = tol ? tol : '關閉';
    prepEl.hidden = false; setMode('preview');
  }
  tolIn.oninput = () => {
    if (!prep) return;
    prep.tol = +tolIn.value; tolOut.textContent = prep.tol ? prep.tol : '關閉';
    prep.lassoCut = null; prep.sprite = makeSprite(prep.raw, prep.tol); prepRender();
  };
  $('pCancel').onclick = () => { prepEl.hidden = true; prep = null; };
  $('pLasso').onclick = () => setMode('lasso');
  $('lBack').onclick = () => setMode('preview');
  $('lRedo').onclick = () => { ppts = []; prepRender(); };
  $('lDone').onclick = () => {
    if (ppts.length < 8){ prepMsg.textContent = '還沒有畫出封閉的圈,請沿著角色畫一整圈。'; return; }
    const raw = prep.lassoCut || prep.sprite, c = document.createElement('canvas'); c.width = raw.width; c.height = raw.height;
    const x = c.getContext('2d', {willReadFrequently:true});
    x.beginPath(); ppts.forEach((q, i) => { const px = (q.x - fit.ox)/fit.s, py = (q.y - fit.oy)/fit.s; i ? x.lineTo(px, py) : x.moveTo(px, py); });
    x.closePath(); x.clip(); x.drawImage(raw, 0, 0);
    const o = cropAlpha(c);
    if (!o){ prepMsg.textContent = '圈的範圍太小,請重畫。'; return; }
    prep.lassoCut = o; tolIn.value = 0; tolOut.textContent = '關閉'; setMode('preview');
  };
  const ppos = e => { const r = pcv.getBoundingClientRect(); return {x: (e.clientX - r.left)*PS/r.width, y: (e.clientY - r.top)*PS/r.height}; };
  pcv.addEventListener('pointerdown', e => { if (pmode !== 'lasso') return; pdraw = true; ppts = [ppos(e)]; pcv.setPointerCapture(e.pointerId); prepRender(); });
  pcv.addEventListener('pointermove', e => { if (!pdraw) return; ppts.push(ppos(e)); prepRender(); });
  const pend = () => { if (pdraw){ pdraw = false; prepRender(); } };
  pcv.addEventListener('pointerup', pend); pcv.addEventListener('pointercancel', pend);

  function addFromUrl(kind, url){
    if (lib.length >= MAX_LIB + BUILTINS.length){ toast('角色庫滿了(最多 ' + MAX_LIB + ' 個),先刪掉一些。'); return false; }
    if (items.length >= MAX_ITEMS){ toast('草地上東西太多了,先收起來一些。'); return false; }
    const e = addLib(kind, url);
    items.push(newItem({type: kind === 'char' ? 'char' : 'deco', ref: e.id, drop: kind === 'char'}));
    saveAll(); refreshUI();
    return true;
  }
  function finishPrep(kind){
    if (!prep) return;
    const url = encode(prep.lassoCut || prep.sprite);
    if (!url){ prepMsg.textContent = '這張圖太大了,換一張或用手動描邊縮小範圍。'; return; }
    if (addFromUrl(kind, url)){ prepEl.hidden = true; prep = null; }
  }
  $('pChar').onclick = () => finishPrep('char');
  $('pProp').onclick = () => finishPrep('prop');

  /* ================= upload ================= */
  const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  async function handleFile(f){
    if (!f) return;
    if (!f.type.startsWith('image/')){ toast('請選擇圖片檔案。'); return; }
    try {
      const url = URL.createObjectURL(f);
      const img = await loadImg(url);
      URL.revokeObjectURL(url);
      openPrep(img);
    } catch(e){ toast('這張照片讀不進來,換一張試試。'); }
  }
  $('file').onchange = () => { handleFile($('file').files[0]); $('file').value = ''; };
  addEventListener('dragover', e => e.preventDefault());

  $('demo').onclick = () => { placeBuiltins(); saveAll(); refreshUI(); };

  /* ================= boot ================= */
  const themeChange = () => readUI();
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', themeChange);
  new MutationObserver(themeChange).observe(root, {attributes: true, attributeFilter: ['data-theme']});
  addEventListener('resize', resize);
  addEventListener('pagehide', saveAll);
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveAll(); });
  addEventListener('keydown', e => { if (e.key === 'Escape'){ disarm(); if (tray) closeTray(); } });

  readUI();
  resize();
  setWeather(pickWeather('typhoon')); Object.assign(wx, Object.fromEntries(WX_KEYS.map(k => [k, WX[wxName][k]])));
  for (const b of BUILTINS) addLib('char', b.img, b.id, {builtin: true, mode: b.mode, name: b.name, size: b.size, cheer: b.cheer, closed: b.closed, neck: b.neck, paw: b.paw});
  loadAll();
  refreshUI();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
